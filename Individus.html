<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPPD • Individus Neon</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { slate: { 750: '#2d3748', 850: '#1a202c', 950: '#0f172a' } }
                }
            }
        }
    </script>
    <style>
        body { background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="text-slate-300 font-sans min-h-screen flex flex-col antialiased">

    <header class="sticky top-4 z-50 px-4 mb-8">
        <div class="max-w-7xl mx-auto bg-slate-800/80 backdrop-blur-md border border-slate-700/50 rounded-2xl p-4 flex justify-between items-center shadow-2xl">
            <div class="flex items-center gap-4">
                <div class="bg-blue-600/20 p-2 rounded-lg border border-blue-500/30">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                </div>
                <h1 class="text-xl font-bold text-white tracking-tight">BASE DE DONNÉES</h1>
            </div>
            <a href="index.html" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-xl font-bold text-xs uppercase transition-all">Calculateur</a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto w-full p-4 space-y-8">
        
        <section class="bg-slate-800/50 border border-slate-700 rounded-2xl p-6 shadow-xl">
            <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-4">Nouvel Enregistrement</h3>
            <form id="addForm" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="text" id="nom" placeholder="Nom Prénom" required class="bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:ring-2 focus:ring-blue-500 outline-none">
                <input type="text" id="tel" placeholder="N° de téléphone" required class="bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:ring-2 focus:ring-blue-500 outline-none">
                <select id="statut" class="bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="En règle">En règle</option>
                    <option value="Recherché">Recherché</option>
                </select>
                <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition-all uppercase text-[10px] tracking-widest">Enregistrer</button>
            </form>
        </section>

        <div class="relative">
            <input type="text" id="search" placeholder="Rechercher un suspect..." onkeyup="filter()" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl p-4 text-white focus:ring-2 focus:ring-blue-500/50 outline-none">
        </div>

        <div id="container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <script>
        async function load() {
            const res = await fetch('/api/individus');
            const data = await res.json();
            const container = document.getElementById('container');
            container.innerHTML = '';

            data.forEach(indiv => {
                const isRech = indiv.statut === "Recherché";
                const card = document.createElement('div');
                card.className = 'bg-slate-800/90 border border-slate-700/50 rounded-2xl overflow-hidden shadow-xl animate-fade-in';
                card.innerHTML = `
                    <div class="p-5 border-b border-slate-700 ${isRech ? 'bg-red-950/30' : 'bg-slate-850'}">
                        <div class="flex justify-between items-center mb-1">
                            <h2 class="text-lg font-bold text-white">${indiv.nom}</h2>
                            <span class="px-2 py-1 rounded text-[9px] font-bold uppercase ${isRech ? 'bg-red-500 text-white' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'}">${indiv.statut}</span>
                        </div>
                        <p class="text-xs text-slate-500">Tél: <span class="text-slate-300 font-mono">${indiv.telephone}</span></p>
                    </div>
                    <div class="p-5 space-y-4">
                        <div class="flex justify-between text-[10px] font-bold text-slate-500 uppercase">
                            <span>Dernière Intervention</span>
                            <span>${indiv.derniere_intervention}</span>
                        </div>
                        <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700/30 text-[11px] text-slate-400 italic leading-relaxed">
                            ${indiv.casiers || "Aucun antécédent notable."}
                        </div>
                    </div>`;
                container.appendChild(card);
            });
        }

        document.getElementById('addForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.innerText = "...";

            const body = {
                nom: document.getElementById('nom').value,
                telephone: document.getElementById('tel').value,
                statut: document.getElementById('statut').value,
                derniere_intervention: new Date().toLocaleDateString('fr-FR'),
                casiers: ""
            };

            await fetch('/api/individus', { method: 'POST', body: JSON.stringify(body) });
            e.target.reset();
            btn.disabled = false;
            btn.innerText = "Enregistrer";
            load();
        };

        function filter() {
            const val = document.getElementById('search').value.toLowerCase();
            document.querySelectorAll('#container > div').forEach(c => {
                c.style.display = c.querySelector('h2').innerText.toLowerCase().includes(val) ? '' : 'none';
            });
        }

        load();
    </script>
</body>
</html>
