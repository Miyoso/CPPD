<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPPD • Individus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%); background-color: #0f172a; color: #cbd5e1; min-height: 100vh; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8">
    <header class="max-w-7xl mx-auto mb-8 flex justify-between items-center bg-slate-800/50 p-4 rounded-2xl border border-slate-700/50 shadow-2xl">
        <div class="flex items-center gap-4">
            <h1 class="text-xl font-bold text-white tracking-tight">BASE DE DONNÉES</h1>
            <span id="totalSuspects" class="bg-blue-600/20 text-blue-400 text-[10px] font-black px-2 py-1 rounded border border-blue-500/30 uppercase tracking-tighter">0 Suspects</span>
        </div>
        <div class="flex gap-2">
            <a href="index.html" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-xl font-bold text-xs uppercase transition-all">Calculateur</a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto space-y-6">
        <input type="text" id="search" placeholder="Rechercher suspect..." onkeyup="filter()" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl p-4 text-white focus:ring-2 focus:ring-blue-500/50 outline-none">
        <div id="container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <script>
        async function load() {
            try {
                const res = await fetch('/api/individus');
                const data = await res.json();
                const container = document.getElementById('container');
                
                document.getElementById('totalSuspects').innerText = `${data.length} Suspect${data.length > 1 ? 's' : ''}`;
                
                container.innerHTML = data.map(i => {
                    const isR = i.statut === "Recherché";
                    const nbInfractions = i.historique ? i.historique.length : 0;
                    
                    const rows = (i.historique || []).map(h => `
                        <div class="border-t border-slate-700/50 py-3 first:border-t-0">
                            <div class="flex justify-between text-[10px] text-slate-500 mb-1 font-bold">
                                <span>LE ${h.derniere_intervention || 'INCONNU'}</span>
                            </div>
                            <p class="text-xs text-blue-400 font-semibold mb-1">${h.motif || 'Aucun motif'}</p>
                            <div class="bg-slate-950/40 p-2 rounded border border-slate-700/30 text-[10px] text-slate-400 italic">
                                ${h.casiers || 'Pas de détails'}
                            </div>
                        </div>
                    `).join('');

                    return `
                        <div class="bg-slate-800/80 border border-slate-700/50 rounded-2xl shadow-xl flex flex-col">
                            <div class="p-5 border-b border-slate-700 ${isR ? 'bg-red-950/20' : 'bg-slate-900/40'}">
                                <div class="flex justify-between items-start mb-1">
                                    <div>
                                        <h2 class="text-lg font-bold text-white">${i.nom}</h2>
                                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">${nbInfractions} Infraction${nbInfractions > 1 ? 's' : ''}</p>
                                    </div>
                                    <span class="px-2 py-1 rounded text-[10px] font-black ${isR ? 'bg-red-600 text-white' : 'bg-emerald-600/20 text-emerald-400 border border-emerald-500/50'}">
                                        ${i.statut.toUpperCase()}
                                    </span>
                                </div>
                                <p class="text-xs text-slate-500 font-mono mt-2">Tél: ${i.telephone}</p>
                            </div>
                            <div class="p-5">
                                <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3">Historique des méfaits</h3>
                                <div class="space-y-2 max-h-60 overflow-y-auto pr-2">
                                    ${rows}
                                </div>
                            </div>
                        </div>`;
                }).join('');
            } catch (err) {
                console.error(err);
                document.getElementById('container').innerHTML = '<p class="text-red-400 text-center col-span-full">Erreur réseau.</p>';
            }
        }

        function filter() {
            const v = document.getElementById('search').value.toLowerCase();
            document.querySelectorAll('#container > div').forEach(c => {
                const name = c.querySelector('h2').innerText.toLowerCase();
                c.style.display = name.includes(v) ? '' : 'none';
            });
        }
        load();
    </script>
</body>
</html>
