<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPPD • Individus</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { slate: { 750: '#2d3748', 850: '#1a202c', 950: '#0f172a' } } } } }
    </script>
    <style>
        body { background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="text-slate-300 font-sans min-h-screen flex flex-col antialiased">
    <header class="sticky top-4 z-50 px-4 mb-8">
        <div class="max-w-7xl mx-auto bg-slate-800/80 backdrop-blur-md border border-slate-700/50 rounded-2xl p-4 flex justify-between items-center shadow-2xl">
            <h1 class="text-xl font-bold text-white tracking-tight">BASE DE DONNÉES</h1>
            <div class="flex gap-2">
                <a href="index.html" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-xl font-bold text-xs uppercase transition-all">Calculateur</a>
                <a href="Lois.html" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-xl font-bold text-xs uppercase transition-all">Lois</a>
            </div>
        </div>
    </header>
    <main class="max-w-7xl mx-auto w-full p-4 space-y-8">
        <div class="relative"><input type="text" id="search" placeholder="Rechercher suspect..." onkeyup="filter()" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl p-4 text-white focus:ring-2 focus:ring-blue-500/50 outline-none transition-all"></div>
        <div id="container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>
    <script>
        async function load() {
            const res = await fetch('/api/individus');
            const data = await res.json();
            const container = document.getElementById('container');
            container.innerHTML = data.map(i => {
                const isR = i.statut === "Recherché";
                return `
                    <div class="bg-slate-800/90 border border-slate-700/50 rounded-2xl overflow-hidden shadow-xl animate-fade-in">
                        <div class="p-5 border-b border-slate-700 ${isR ? 'bg-red-950/30' : 'bg-slate-850'}">
                            <div class="flex justify-between items-center mb-1"><h2 class="text-lg font-bold text-white">${i.nom}</h2><span class="px-2 py-1 rounded text-[9px] font-bold uppercase ${isR ? 'bg-red-500 text-white' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'}">${i.statut}</span></div>
                            <p class="text-xs text-slate-500 font-mono">Tél: ${i.telephone}</p>
                        </div>
                        <div class="p-5 space-y-3">
                            <div><span class="text-[9px] font-bold text-slate-500 uppercase">Motif d'arrestation</span><p class="text-[11px] text-blue-400 font-medium">${i.motif}</p></div>
                            <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700/30 text-[10px] text-slate-400 italic">${i.casiers}</div>
                            <div class="text-[9px] text-slate-600 text-right uppercase font-bold">Le ${i.derniere_intervention}</div>
                        </div>
                    </div>`;
            }).join('');
        }
        function filter() {
            const v = document.getElementById('search').value.toLowerCase();
            document.querySelectorAll('#container > div').forEach(c => { c.style.display = c.querySelector('h2').innerText.toLowerCase().includes(v) ? '' : 'none'; });
        }
        load();
    </script>
</body>
</html>
