<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPPD • Individus</title>
    <link rel="icon" type="image/png" href="LogoCPPD.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%); 
            background-color: #0f172a; 
            color: #cbd5e1; 
            min-height: 100vh; 
        }
        body::before {
            content: "";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background-image: url('LogoCPPD.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0.03;
            pointer-events: none;
            z-index: -1;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col antialiased">
    <header class="max-w-7xl mx-auto w-full mb-8 flex justify-between items-center bg-slate-800/50 p-4 rounded-2xl border border-slate-700/50 shadow-2xl">
        <div class="flex items-center gap-4">
            <img src="LogoCPPD.png" alt="Logo" class="w-10 h-10 object-contain">
            <h1 class="text-xl font-bold text-white tracking-tight uppercase">Base de données</h1>
            <span id="totalSuspects" class="bg-blue-600/20 text-blue-400 text-[10px] font-black px-2 py-1 rounded border border-blue-500/30 uppercase">0 Suspects</span>
        </div>
        <div class="flex gap-2">
            <a href="Logs.html" class="bg-red-900/40 hover:bg-red-800 text-red-200 px-4 py-2 rounded-xl font-bold text-xs uppercase transition-all border border-red-700/30">Logs</a>
            <a href="index.html" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-xl font-bold text-xs uppercase transition-all">Calculateur</a>
            <a href="Plainte.html" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-xl font-bold text-xs uppercase transition-all">Plainte</a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto w-full space-y-6">
        <input type="text" id="search" placeholder="Rechercher suspect..." onkeyup="filter()" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl p-4 text-white outline-none focus:ring-2 focus:ring-blue-500/50">
        <div id="container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <script>
        async function updateStatus(nom, newStatus) {
            await fetch(`/api/individus?nom=${encodeURIComponent(nom)}`, { method: 'PATCH', body: JSON.stringify({ statut: newStatus }) });
            load();
        }

        async function editName(ancienNom) {
            const nouveauNom = prompt("Entrez le nouveau Nom Prénom :", ancienNom);
            if (nouveauNom && nouveauNom !== ancienNom) {
                await fetch(`/api/individus?nom=${encodeURIComponent(ancienNom)}`, { method: 'PATCH', body: JSON.stringify({ nouveau_nom: nouveauNom }) });
                load();
            }
        }

        async function editPhone(nom, ancienTel) {
            const nouveauTel = prompt("Entrez le nouveau numéro :", ancienTel);
            if (nouveauTel && nouveauTel !== ancienTel) {
                await fetch(`/api/individus?nom=${encodeURIComponent(nom)}`, { method: 'PATCH', body: JSON.stringify({ nouveau_telephone: nouveauTel }) });
                load();
            }
        }

        async function updatePayment(id, status) {
            await fetch(`/api/individus?infraction_id=${id}`, { method: 'PATCH', body: JSON.stringify({ paiement: status }) });
            load();
        }

        async function updatePhoto(nom) {
            const newPhoto = prompt("Lien de la photo :");
            if (newPhoto !== null) {
                await fetch(`/api/individus?nom=${encodeURIComponent(nom)}`, { method: 'PATCH', body: JSON.stringify({ photo_url: newPhoto }) });
                load();
            }
        }

        async function saveNote(nom, noteText) {
            await fetch(`/api/individus?nom=${encodeURIComponent(nom)}`, { method: 'PATCH', body: JSON.stringify({ notes: noteText }) });
        }

        async function deleteSuspect(nom) {
            const motif = prompt("Motif de la suppression :");
            const officier = prompt("Votre Matricule / Nom :");
            if (motif && officier) {
                if (confirm(`Supprimer définitivement ${nom} ?`)) {
                    await fetch(`/api/individus?nom=${encodeURIComponent(nom)}&motif_suppression=${encodeURIComponent(motif)}&officier=${encodeURIComponent(officier)}`, { method: 'DELETE' });
                    load();
                }
            }
        }

        async function load() {
            try {
                const res = await fetch('/api/individus');
                const data = await res.json();
                document.getElementById('totalSuspects').innerText = `${data.length} Suspect${data.length > 1 ? 's' : ''}`;
                document.getElementById('container').innerHTML = data.map(i => {
                    const isR = i.statut === "Recherché";
                    const photoHtml = i.photo_url 
                        ? `<div class="relative group cursor-pointer" onclick="updatePhoto('${i.nom}')">
                            <img src="${i.photo_url}" class="w-full h-48 object-cover border-b border-slate-700 transition-opacity group-hover:opacity-50">
                            <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                <span class="bg-black/60 text-white text-[10px] font-bold px-3 py-1 rounded-full uppercase">Modifier Image</span>
                            </div>
                           </div>` 
                        : `<div onclick="updatePhoto('${i.nom}')" class="w-full h-48 bg-slate-900/50 flex flex-col items-center justify-center border-b border-slate-700 text-slate-700 font-black text-xs cursor-pointer hover:bg-slate-800">
                            <span>SANS PHOTO</span>
                           </div>`;
                    const rows = (i.historique || []).map(h => {
                        const isPaid = h.paiement === 'Réglé';
                        return `<div class="border-t border-slate-700/50 py-3 first:border-t-0">
                            <div class="flex justify-between items-start mb-1">
                                <p class="text-[9px] text-slate-500 font-bold uppercase">LE ${h.derniere_intervention}</p>
                                <select onchange="updatePayment(${h.id}, this.value)" class="text-[8px] font-bold rounded px-1 py-0.5 outline-none ${isPaid ? 'bg-emerald-500/10 text-emerald-400' : 'bg-orange-500/10 text-orange-400'}">
                                    <option value="Réglé" ${isPaid ? 'selected' : ''}>RÉGLÉ</option>
                                    <option value="Non réglé" ${!isPaid ? 'selected' : ''}>À PAYER</option>
                                </select>
                            </div>
                            <p class="text-xs text-blue-400 font-semibold mb-1">${h.motif}</p>
                            <p class="text-[10px] text-slate-400 italic bg-slate-950/40 p-2 rounded border border-slate-700/30">${h.casiers}</p>
                        </div>`;
                    }).join('');
                    return `<div class="bg-slate-800/80 border border-slate-700/50 rounded-2xl shadow-xl overflow-hidden flex flex-col transition-all">
                        ${photoHtml}
                        <div class="p-5 border-b border-slate-700 ${isR ? 'bg-red-950/20' : 'bg-slate-900/40'}">
                            <div class="flex justify-between items-start mb-1">
                                <div>
                                    <h2 onclick="editName('${i.nom}')" class="text-lg font-bold text-white cursor-pointer hover:text-blue-400 transition-colors">${i.nom}</h2>
                                    <p class="text-[9px] text-slate-400 font-bold uppercase tracking-widest">${i.historique.length} Infraction(s)</p>
                                </div>
                                <select onchange="updateStatus('${i.nom}', this.value)" class="text-[10px] font-black rounded px-2 py-1 outline-none ${isR ? 'bg-red-600 text-white' : 'bg-emerald-600/20 text-emerald-400 border border-emerald-500/50'}">
                                    <option value="En règle" ${i.statut === 'En règle' ? 'selected' : ''}>EN RÈGLE</option>
                                    <option value="Recherché" ${i.statut === 'Recherché' ? 'selected' : ''}>RECHERCHÉ</option>
                                </select>
                            </div>
                            <p onclick="editPhone('${i.nom}', '${i.telephone}')" class="text-xs text-slate-500 font-mono mt-2 cursor-pointer hover:text-white">Tél: ${i.telephone}</p>
                        </div>
                        <div class="px-5 py-3 bg-slate-900/20 border-b border-slate-700/50">
                            <h3 class="text-[9px] font-bold text-slate-500 uppercase mb-2">Notes</h3>
                            <textarea onblur="saveNote('${i.nom}', this.value)" class="w-full bg-transparent text-[11px] text-slate-300 outline-none resize-none h-12 placeholder:text-slate-700 focus:text-white transition-colors">${i.notes || ''}</textarea>
                        </div>
                        <div class="p-5 flex-grow">
                            <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3">Dossier Judiciaire</h3>
                            <div class="space-y-2 max-h-48 overflow-y-auto pr-2">${rows}</div>
                            <button onclick="deleteSuspect('${i.nom}')" class="w-full mt-4 py-2 bg-red-600/10 hover:bg-red-600/30 text-red-500 text-[9px] font-bold uppercase rounded-lg border border-red-500/20 transition-all">Supprimer le suspect</button>
                        </div>
                    </div>`;
                }).join('');
            } catch (e) { console.error(e); }
        }

        function filter() {
            const v = document.getElementById('search').value.toLowerCase();
            document.querySelectorAll('#container > div').forEach(c => {
                const name = c.querySelector('h2').innerText.toLowerCase();
                c.style.display = name.includes(v) ? '' : 'none';
            });
        }
        load();
    </script>
</body>
</html>
