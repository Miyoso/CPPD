<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPPD • Dépôt de Plainte</title>
    <link rel="icon" type="image/png" href="LogoCPPD.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root { --glass: rgba(15, 23, 42, 0.75); --glass-border: rgba(255, 255, 255, 0.1); --accent-blue: #3b82f6; }
        body { background: radial-gradient(circle at 50% 0%, #1e293b 0%, #020617 100%); background-color: #020617; color: #cbd5e1; font-family: 'Inter', sans-serif; min-height: 100vh; }
        body::before { content: ""; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 600px; height: 600px; background-image: url('LogoCPPD.png'); background-repeat: no-repeat; background-position: center; background-size: contain; opacity: 0.03; pointer-events: none; z-index: -1; }
        .glass { background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-border); }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 1.5rem; transition: all 0.3s ease; }
        .glass-input { background: rgba(0, 0, 0, 0.4) !important; border: 1px solid var(--glass-border) !important; color: white !important; outline: none; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8">
    <header class="max-w-7xl mx-auto glass rounded-[2rem] p-6 mb-8 flex flex-col md:flex-row justify-between items-center gap-6 shadow-2xl">
        <div class="flex items-center gap-5">
            <img src="LogoCPPD.png" class="w-12 h-12 object-contain drop-shadow-[0_0_8px_rgba(59,130,246,0.4)]">
            <div>
                <h1 class="text-2xl font-black text-white tracking-tighter uppercase italic">Unité de Renseignement C.P.P.D</h1>
                <p class="text-[10px] font-bold text-blue-400 uppercase tracking-widest">Système de Justice Centralisé</p>
            </div>
        </div>
        <div class="flex gap-3">
            <a href="index.html" class="glass-card px-6 py-2.5 text-[10px] font-bold uppercase hover:bg-blue-600 transition-all">Calculateur</a>
            <a href="Individus.html" class="glass-card px-6 py-2.5 text-[10px] font-bold uppercase hover:bg-blue-600 transition-all">Individus</a>
            <a href="Stocks.html" class="glass-card px-6 py-2.5 text-[10px] font-bold uppercase hover:bg-emerald-600 transition-all">Armurerie</a>
            <a href="Logs.html" class="glass-card px-6 py-2.5 text-[10px] font-bold uppercase hover:bg-red-600 transition-all">Logs</a>
            <a href="Plainte.html" class="glass-card px-6 py-2.5 text-[10px] font-bold uppercase bg-slate-600 transition-all">Plaintes</a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto">
        <div class="glass-card p-8 space-y-6">
            <div class="border-l-4 border-blue-500 pl-4 mb-8">
                <h2 class="text-2xl font-black text-white uppercase italic">Enregistrer une Plainte</h2>
                <p class="text-xs text-slate-400 uppercase tracking-widest">Formulaire de déclaration officielle</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="text-[10px] font-bold uppercase text-blue-400 ml-2">Nom du plaignant</label>
                    <input type="text" id="plaignant" placeholder="Nom Prénom" class="glass-input w-full rounded-xl p-4 text-sm">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-bold uppercase text-blue-400 ml-2">Téléphone</label>
                    <input type="text" id="telephone" placeholder="555-XXXX" class="glass-input w-full rounded-xl p-4 text-sm">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-bold uppercase text-blue-400 ml-2">Accusé (si connu)</label>
                    <input type="text" id="accuse" placeholder="Nom ou Description" class="glass-input w-full rounded-xl p-4 text-sm">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-bold uppercase text-blue-400 ml-2">Date des faits</label>
                    <input type="date" id="dateFaits" class="glass-input w-full rounded-xl p-4 text-sm">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-[10px] font-bold uppercase text-blue-400 ml-2">Description détaillée</label>
                <textarea id="description" rows="6" placeholder="Décrivez précisément les événements..." class="glass-input w-full rounded-xl p-4 text-sm resize-none"></textarea>
            </div>

            <div class="flex flex-col md:flex-row gap-4 pt-4">
                <button onclick="submitPlainte()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-xl transition-all uppercase text-[10px] shadow-lg">Enregistrer la Plainte</button>
                <button onclick="window.history.back()" class="px-8 bg-slate-800 hover:bg-slate-700 text-white font-black py-4 rounded-xl transition-all uppercase text-[10px]">Annuler</button>
            </div>
        </div>
    </main>

    <script>
        async function submitPlainte() {
            const data = {
                plaignant: document.getElementById('plaignant').value,
                telephone: document.getElementById('telephone').value,
                accuse: document.getElementById('accuse').value || "Inconnu",
                date: document.getElementById('dateFaits').value,
                description: document.getElementById('description').value,
                officier: "Système"
            };

            if(!data.plaignant || !data.description) {
                return alert("Veuillez remplir au moins le nom et la description.");
            }

            try {
                
                console.log("Données de plainte :", data);
                alert("Plainte enregistrée avec succès ! (Simulation)");
                window.location.href = "index.html";
            } catch (e) {
                console.error(e);
                alert("Erreur lors de l'enregistrement.");
            }
        }

        // Initialisation de la date du jour par défaut
        document.getElementById('dateFaits').valueAsDate = new Date();
    </script>
</body>
</html>
