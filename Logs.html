<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>CPPD • Logs de Sécurité</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%); background-color: #0f172a; min-height: 100vh; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    </style>
</head>
<body class="p-8 text-slate-300">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 bg-slate-800/50 p-6 rounded-2xl border border-slate-700/50 shadow-2xl">
            <div>
                <h1 class="text-2xl font-bold text-white tracking-tight">LOGS SYSTÈME</h1>
                <p class="text-xs text-slate-500 uppercase font-bold tracking-widest">Historique des actions critiques</p>
            </div>
            <a href="Individus.html" class="bg-slate-700 hover:bg-slate-600 text-white px-6 py-2 rounded-xl font-bold text-xs uppercase transition-all">Retour</a>
        </header>

        <div class="bg-slate-900/50 rounded-2xl border border-slate-700/50 overflow-hidden shadow-2xl">
            <table class="w-full text-left">
                <thead class="bg-slate-950/50 text-[10px] uppercase font-black text-slate-500 tracking-widest">
                    <tr>
                        <th class="p-4">Date</th>
                        <th class="p-4">Action</th>
                        <th class="p-4">Officier</th>
                        <th class="p-4">Détail</th>
                    </tr>
                </thead>
                <tbody id="logContent" class="text-sm"></tbody>
            </table>
        </div>
    </div>
    <script>
        async function fetchLogs() {
            const res = await fetch('/api/individus?type=logs');
            const data = await res.json();
            document.getElementById('logContent').innerHTML = data.map(l => `
                <tr class="border-t border-slate-800 hover:bg-slate-800/30 transition-colors">
                    <td class="p-4 font-mono text-xs text-slate-500">${new Date(l.date).toLocaleString()}</td>
                    <td class="p-4">
                        <span class="px-2 py-1 rounded text-[10px] font-black ${l.action === 'SUPPRESSION' ? 'bg-red-500/10 text-red-400' : 'bg-emerald-500/10 text-emerald-400'}">
                            ${l.action}
                        </span>
                    </td>
                    <td class="p-4 font-bold text-white">${l.officier}</td>
                    <td class="p-4 italic text-slate-400">${l.detail}</td>
                </tr>
            `).join('');
        }
        fetchLogs();
    </script>
</body>
</html>
