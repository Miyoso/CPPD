<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPPD • Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        slate: { 750: '#2d3748', 850: '#1a202c', 950: '#0f172a' }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        body { background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%); }
    </style>
</head>
<body class="text-slate-300 font-sans min-h-screen flex flex-col antialiased selection:bg-blue-500 selection:text-white">

    <header class="sticky top-4 z-50 px-4 mb-4">
        <div class="max-w-7xl mx-auto bg-slate-800/80 backdrop-blur-md border border-slate-700/50 rounded-2xl shadow-2xl p-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <div class="bg-blue-600/20 p-2 rounded-lg border border-blue-500/30">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3" /></svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white tracking-tight">• CPPD</h1>
                    <p class="text-xs text-slate-400 font-medium tracking-wide uppercase">Calculateur Pénal</p>
                </div>
            </div>
            
            <div class="relative w-full md:w-96 group">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-slate-500 group-focus-within:text-blue-400 transition-colors" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" /></svg>
                </div>
                <input 
                    type="text" 
                    id="searchBar"
                    placeholder="Rechercher une infraction..." 
                    disabled
                    class="block w-full pl-10 pr-3 py-2.5 border border-slate-700 rounded-xl leading-5 bg-slate-900/50 text-slate-100 placeholder-slate-500 focus:outline-none focus:bg-slate-900 focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all duration-200 sm:text-sm shadow-inner opacity-50"
                    onkeyup="filterLaws()"
                >
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto w-full p-4 flex flex-col-reverse lg:flex-row gap-8 items-start">
        
        <div id="lawsContainer" class="flex-1 w-full space-y-8 pb-20">
            <div class="flex flex-col items-center justify-center h-64 space-y-4">
                <div class="relative w-16 h-16">
                    <div class="absolute top-0 left-0 w-full h-full border-4 border-slate-700 rounded-full"></div>
                    <div class="absolute top-0 left-0 w-full h-full border-4 border-blue-500 rounded-full border-t-transparent animate-spin"></div>
                </div>
                <span class="text-slate-400 font-medium animate-pulse">Connexion au serveur du Gouvernement...</span>
            </div>
        </div>

        <div class="lg:w-[380px] shrink-0 lg:sticky lg:top-32">
            <div class="bg-slate-800/90 backdrop-blur-sm rounded-2xl border border-slate-700/50 shadow-2xl overflow-hidden flex flex-col transition-all duration-300 hover:shadow-blue-900/10">
                
                <div class="bg-slate-850 p-4 border-b border-slate-700 flex justify-between items-center">
                    <h2 class="text-sm font-bold text-slate-100 uppercase tracking-wider flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-blue-500 shadow-[0_0_8px_rgba(59,130,246,0.5)]"></span>
                        Sanctions en cours
                    </h2>
                    <span id="countBadge" class="bg-slate-700 text-slate-200 text-xs font-bold px-2.5 py-0.5 rounded-md border border-slate-600">0</span>
                </div>

                <div id="cartList" class="max-h-[40vh] overflow-y-auto p-2 space-y-2 min-h-[150px] bg-slate-900/30">
                    <div class="h-32 flex flex-col items-center justify-center text-slate-600 opacity-60">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
                        <span class="text-xs font-medium">Dossier vide</span>
                    </div>
                </div>

                <div class="p-4 bg-slate-800 border-t border-slate-700 space-y-4">
                    
                    <label class="group relative flex items-center p-4 rounded-xl border border-slate-700 bg-slate-850 cursor-pointer transition-all duration-200 hover:border-slate-500" id="firstOffenseLabel">
                        <input type="checkbox" id="firstOffenseCheck" class="peer sr-only" onchange="calculate()">
                        
                        <div class="flex-1">
                            <div class="flex items-center justify-between">
                                <span class="font-bold text-sm text-slate-200 group-hover:text-white transition-colors">1ère Interpellation</span>
                                
                                <div id="checkboxSquare" class="w-6 h-6 rounded border-2 border-slate-500 bg-slate-900 flex items-center justify-center transition-all shadow-inner">
                                    <svg id="checkboxIcon" class="w-4 h-4 text-white opacity-0 transition-all duration-200 transform scale-50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="20 6 9 17 4 12"></polyline>
                                    </svg>
                                </div>
                            </div>
                            <div class="text-[11px] text-slate-400 mt-1 flex gap-2">
                                <span class="bg-slate-700/50 px-2 py-0.5 rounded text-slate-300 font-medium">Amende ÷ 2</span>
                                <span class="bg-slate-700/50 px-2 py-0.5 rounded text-slate-300 font-medium">Pas de Ban</span>
                            </div>
                        </div>
                    </label>

                    <div class="bg-slate-900 rounded-xl p-4 border border-slate-700 shadow-inner">
                        <div class="flex justify-between items-end mb-2">
                            <span class="text-[10px] uppercase font-bold text-slate-500 tracking-wider">Montant à facturer</span>
                            <span id="totalFine" class="text-3xl font-bold text-emerald-400 font-mono tracking-tight leading-none">0 $</span>
                        </div>
                        <div class="h-px bg-slate-800 my-3"></div>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="text-center">
                                <span class="text-[10px] uppercase font-bold text-slate-500 block mb-1">Prison</span>
                                <span id="totalPrison" class="text-base font-bold text-blue-400">Aucune</span>
                            </div>
                            <div class="text-center border-l border-slate-800">
                                <span class="text-[10px] uppercase font-bold text-slate-500 block mb-1">Bannissement</span>
                                <span id="maxBan" class="text-base font-bold text-slate-500">-</span>
                            </div>
                        </div>
                    </div>

                    <button onclick="resetAll()" class="w-full py-3.5 rounded-xl font-bold text-xs uppercase tracking-widest text-white shadow-lg shadow-red-900/20 bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                        Nouveau Rapport
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQDxMAqXZPZlHBCccPSU1Wq35l7wMeQdUUEJabIJkdsEjVKnF3gginHkCo6PC5nTfeVtDupnI8ad8su/pub?gid=0&single=true&output=csv";
        
        let categories = [];
        let cart = [];

        const categoryStyles = {
            "Code de la route": "from-emerald-900/50 to-emerald-900/10 border-emerald-500/50 text-emerald-100",
            "Délit mineur": "from-blue-900/50 to-blue-900/10 border-blue-500/50 text-blue-100",
            "Délits moyen": "from-yellow-900/50 to-yellow-900/10 border-yellow-500/50 text-yellow-100",
            "Délits majeur": "from-red-900/50 to-red-900/10 border-red-500/50 text-red-100",
            "Crime": "from-purple-900/50 to-purple-900/10 border-purple-500/50 text-purple-100",
            "Objet illégaux et drogues": "from-orange-900/50 to-orange-900/10 border-orange-500/50 text-orange-100",
            "Armes": "from-slate-700 to-slate-800 border-slate-500/50 text-slate-200"
        };
        const defaultStyle = "from-slate-800 to-slate-900 border-slate-600 text-slate-300";

        async function init() {
            try {
                const response = await fetch(SHEET_URL + "&t=" + Date.now());
                const data = await response.text();
                parseCSV(data);
                renderLaws();
                
                const searchInput = document.getElementById('searchBar');
                searchInput.disabled = false;
                searchInput.style.opacity = "1";

            } catch (error) {
                document.getElementById('lawsContainer').innerHTML = `<div class="bg-red-900/20 border border-red-500/30 rounded-2xl p-8 text-center"><p class="text-red-400 font-bold text-lg mb-2">Erreur de connexion</p><p class="text-red-300/70 text-sm">Impossible de récupérer les lois depuis le Gouv.</p></div>`;
            }
        }

        function parseCSV(csvText) {
            const rows = csvText.split('\n').slice(1);
            const tempCats = {};

            rows.forEach(row => {
                const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); 
                if (cols.length < 5) return; 

                const catName = cols[0].replace(/"/g, '').trim();
                const label = cols[1].replace(/"/g, '').trim();
                const fine = parseInt(cols[2].replace(/\D/g, '')) || 0;
                const prison = parseInt(cols[3].replace(/\D/g, '')) || 0;
                const ban = parseInt(cols[4].replace(/\D/g, '')) || 0;
                const sanction = cols[5] ? cols[5].replace(/"/g, '').trim() : "";

                if (!catName || !label) return;

                if (!tempCats[catName]) {
                    tempCats[catName] = {
                        name: catName,
                        style: categoryStyles[catName] || defaultStyle,
                        items: []
                    };
                }
                tempCats[catName].items.push({ label, fine, prison, ban, sanction });
            });
            categories = Object.values(tempCats);
        }

        function renderLaws() {
            const container = document.getElementById('lawsContainer');
            container.innerHTML = '';

            if(categories.length === 0) return;

            categories.forEach((cat, catIndex) => {
                const section = document.createElement('div');
                section.className = 'law-category animate-fade-in mb-8'; 
                
                const title = document.createElement('div');
                title.className = `flex items-center px-4 py-3 rounded-t-xl border-t border-x bg-gradient-to-r ${cat.style}`;
                title.innerHTML = `<h2 class="text-sm font-bold uppercase tracking-widest">${cat.name}</h2>`;
                section.appendChild(title);

                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 bg-slate-800/50 p-4 rounded-b-xl border-x border-b border-slate-700/50 shadow-lg';

                cat.items.forEach((item, itemIndex) => {
                    const btn = document.createElement('button');
                    const uniqueId = `btn-${catIndex}-${itemIndex}`;
                    btn.id = uniqueId;
                    
                    btn.className = 'law-item group relative text-left p-3.5 rounded-xl border border-slate-700 bg-slate-800 hover:bg-slate-750 transition-all duration-200 flex flex-col justify-between h-full shadow-sm hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 active:shadow-none';
                    btn.onclick = () => toggleItem(catIndex, itemIndex, uniqueId);
                    
                    btn.innerHTML = `
                        <div class="flex justify-between items-start gap-3 mb-2">
                            <span class="font-medium text-slate-200 text-sm leading-snug group-hover:text-white">${item.label}</span>
                            <span class="shrink-0 font-mono text-xs font-bold text-emerald-400 bg-emerald-900/10 px-2 py-1 rounded border border-emerald-500/20">${item.fine.toLocaleString()} $</span>
                        </div>
                        ${item.sanction ? `
                            <div class="mt-auto pt-2 border-t border-slate-700/50 w-full flex items-start gap-1.5 opacity-80 group-hover:opacity-100 transition-opacity">
                                <span class="text-[10px] text-orange-400 mt-0.5">⚠️</span> 
                                <span class="text-[10px] text-orange-200/90 italic leading-tight">${item.sanction}</span>
                            </div>
                        ` : ''}
                        <div class="absolute inset-0 border-2 border-blue-500 rounded-xl opacity-0 scale-95 transition-all duration-200 pointer-events-none selection-ring"></div>
                    `;
                    grid.appendChild(btn);
                });

                section.appendChild(grid);
                container.appendChild(section);
            });
        }

        function toggleItem(catIndex, itemIndex, btnId) {
            const item = categories[catIndex].items[itemIndex];
            const btn = document.getElementById(btnId);
            const ring = btn.querySelector('.selection-ring');
            
            const existingIndex = cart.findIndex(i => i.label === item.label);

            if (existingIndex > -1) {
                cart.splice(existingIndex, 1);
                ring.classList.remove('opacity-100', 'scale-100');
                ring.classList.add('opacity-0', 'scale-95');
                btn.classList.remove('bg-slate-800'); 
            } else {
                cart.push(item);
                ring.classList.remove('opacity-0', 'scale-95');
                ring.classList.add('opacity-100', 'scale-100');
            }
            calculate();
        }

        function calculate() {
            const list = document.getElementById('cartList');
            const badge = document.getElementById('countBadge');
            
            list.innerHTML = '';
            badge.innerText = `${cart.length}`;

            if (cart.length === 0) {
                list.innerHTML = `
                    <div class="h-32 flex flex-col items-center justify-center text-slate-600 opacity-60">
                         <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
                         <span class="text-xs font-medium">Dossier vide</span>
                    </div>`;
            } else {
                cart.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'bg-slate-800 p-2.5 rounded-lg border border-slate-700/50 hover:border-slate-600 transition-colors group animate-fade-in-up';
                    
                    let content = `
                        <div class="flex justify-between items-start text-sm">
                            <span class="text-slate-200 font-medium leading-tight pr-2">${item.label}</span>
                            <span class="text-emerald-400 font-mono text-xs font-bold whitespace-nowrap">${item.fine} $</span>
                        </div>
                    `;
                    
                    if (item.sanction) {
                        content += `
                            <div class="text-[10px] text-orange-300/80 italic mt-1 pt-1 border-t border-slate-700/50">
                                ➤ ${item.sanction}
                            </div>
                        `;
                    }

                    row.innerHTML = content;
                    list.appendChild(row);
                });
            }

            let totalFine = cart.reduce((acc, item) => acc + item.fine, 0);
            const totalPrison = cart.reduce((acc, item) => acc + item.prison, 0);
            let maxBan = cart.reduce((max, item) => (item.ban > max ? item.ban : max), 0);

            const isFirstOffense = document.getElementById('firstOffenseCheck').checked;
            const offenseLabel = document.getElementById('firstOffenseLabel');
            const checkboxSquare = document.getElementById('checkboxSquare');
            const checkboxIcon = document.getElementById('checkboxIcon');
            
            if (isFirstOffense) {
                totalFine = Math.floor(totalFine / 2);
                if (maxBan < 999) {
                    maxBan = 0; 
                }
                
                // Style Active
                offenseLabel.className = "group relative flex items-center p-4 rounded-xl border-2 border-emerald-500 bg-emerald-950/40 cursor-pointer transition-all duration-200 shadow-[0_0_15px_rgba(16,185,129,0.2)]";
                checkboxSquare.className = "w-6 h-6 rounded border-2 border-emerald-500 bg-emerald-600 flex items-center justify-center transition-all shadow-inner";
                checkboxIcon.classList.remove('opacity-0', 'scale-50');
                checkboxIcon.classList.add('opacity-100', 'scale-100');
            } else {
                // Style Inactive
                offenseLabel.className = "group relative flex items-center p-4 rounded-xl border border-slate-700 bg-slate-850 cursor-pointer transition-all duration-200 hover:border-slate-500 hover:bg-slate-800";
                checkboxSquare.className = "w-6 h-6 rounded border-2 border-slate-500 bg-slate-900 flex items-center justify-center transition-all shadow-inner";
                checkboxIcon.classList.remove('opacity-100', 'scale-100');
                checkboxIcon.classList.add('opacity-0', 'scale-50');
            }

            document.getElementById('totalFine').innerText = totalFine.toLocaleString() + " $";
            
            if (totalPrison > 0) {
                document.getElementById('totalPrison').innerText = totalPrison + " Min";
            } else {
                document.getElementById('totalPrison').innerText = "Aucune";
            }
            
            const banEl = document.getElementById('maxBan');
            if (maxBan >= 999) {
                banEl.innerText = "DÉFINITIF";
                banEl.className = "text-base font-bold text-red-500 animate-pulse";
            } else if (maxBan > 0) {
                banEl.innerText = maxBan + " Jours";
                banEl.className = "text-base font-bold text-red-400";
            } else {
                banEl.innerText = "Non";
                banEl.className = "text-base font-bold text-slate-500";
            }
        }

        function filterLaws() {
            const term = document.getElementById('searchBar').value.toLowerCase();
            const categoriesDivs = document.getElementsByClassName('law-category');

            Array.from(categoriesDivs).forEach(catDiv => {
                const buttons = catDiv.getElementsByTagName('button');
                let hasVisible = false;

                Array.from(buttons).forEach(btn => {
                    const text = btn.innerText.toLowerCase();
                    if (text.includes(term)) {
                        btn.style.display = "flex";
                        hasVisible = true;
                    } else {
                        btn.style.display = "none";
                    }
                });
                
                catDiv.style.display = hasVisible ? "block" : "none";
            });
        }

        function resetAll() {
            cart = [];
            document.getElementById('firstOffenseCheck').checked = false;
            document.querySelectorAll('.selection-ring').forEach(el => {
                el.classList.remove('opacity-100', 'scale-100');
                el.classList.add('opacity-0', 'scale-95');
            });
            calculate();
        }

        const styleSheet = document.createElement("style");
        styleSheet.innerText = `
            @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
            .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
            .animate-fade-in-up { animation: fadeIn 0.2s ease-out forwards; }
        `;
        document.head.appendChild(styleSheet);

        init();
    </script>
</body>
</html>
