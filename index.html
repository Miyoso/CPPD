<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPPD • Calculateur de Peines</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        slate: { 750: '#2d3748', 850: '#1a202c', 950: '#0f172a' }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        body { background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%); }
    </style>
</head>
<body class="text-slate-300 font-sans min-h-screen flex flex-col antialiased selection:bg-blue-500 selection:text-white">

    <header class="sticky top-4 z-50 px-4 mb-4">
        <div class="max-w-7xl mx-auto bg-slate-800/80 backdrop-blur-md border border-slate-700/50 rounded-2xl shadow-2xl p-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <div class="bg-blue-600/20 p-2 rounded-lg border border-blue-500/30">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" /></svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white tracking-tight">• CPPD</h1>
                    <p class="text-xs text-slate-400 font-medium tracking-wide uppercase">Calculateur de Peines Intégré</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4 w-full md:w-auto">
                <div class="relative w-full md:w-80 group">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" /></svg>
                    </div>
                    <input type="text" id="searchBar" placeholder="Rechercher une infraction..." class="block w-full pl-10 pr-3 py-2.5 border border-slate-700 rounded-xl bg-slate-900/50 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition-all sm:text-sm" onkeyup="filterLaws()">
                </div>
                <a href="Individus.html" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2.5 rounded-xl font-bold text-xs uppercase tracking-widest transition-all shadow-lg shadow-blue-900/20 text-center">Individus</a>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto w-full p-4 flex flex-col lg:flex-row gap-6 mb-24">
        <div id="lawCategories" class="flex-grow space-y-8">
            <div class="flex items-center justify-center py-12 text-slate-500" id="loader">
                <svg class="animate-spin h-8 w-8 mr-3" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                <span class="font-medium">Chargement des lois depuis Neon...</span>
            </div>
        </div>

        <aside class="w-full lg:w-96 shrink-0">
            <div class="sticky top-24 space-y-4">
                <div class="bg-slate-800/90 backdrop-blur-md rounded-2xl border border-slate-700 shadow-2xl overflow-hidden">
                    <div class="bg-slate-700/50 px-6 py-4 border-b border-slate-600 flex justify-between items-center">
                        <h2 class="text-white font-extrabold text-sm uppercase tracking-wider">Récapitulatif</h2>
                        <button onclick="resetCalculator()" class="text-[10px] font-bold text-slate-400 hover:text-white uppercase transition-colors">Réinitialiser</button>
                    </div>
                    
                    <div id="selectedLaws" class="p-4 space-y-2 max-h-[30vh] overflow-y-auto border-b border-slate-700/50 bg-slate-900/30">
                        <div class="text-center py-4 text-slate-500 text-sm italic">Aucune infraction sélectionnée</div>
                    </div>

                    <div class="p-6 space-y-6 bg-slate-800/50">
                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-700 shadow-inner">
                                <span class="text-[10px] font-bold text-slate-500 uppercase block mb-1">Amende Total</span>
                                <div id="totalFine" class="text-2xl font-black text-emerald-400 font-mono">0$</div>
                            </div>
                            <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-700 shadow-inner">
                                <span class="text-[10px] font-bold text-slate-500 uppercase block mb-1">Peine (Min)</span>
                                <div id="totalPrison" class="text-2xl font-black text-blue-400 font-mono">0</div>
                            </div>
                        </div>

                        <div id="banDisplay" class="hidden animate-pulse bg-red-500/10 border border-red-500/50 p-4 rounded-xl text-center">
                            <span class="text-[10px] font-bold text-red-400 uppercase block">Risque de Bannissement</span>
                            <div id="totalBan" class="text-xl font-black text-red-500">0 Jours</div>
                        </div>

                        <button onclick="copyToClipboard()" class="w-full bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-extrabold py-4 rounded-xl transition-all shadow-lg shadow-blue-900/20 uppercase text-xs tracking-widest flex items-center justify-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" /></svg>
                            Copier le rapport
                        </button>
                    </div>
                </div>
            </div>
        </aside>
    </main>

    <script>
        let categories = [];
        let selectedItems = [];

        const categoryStyles = {
            'Code de la route': 'bg-blue-500',
            'Délit mineur': 'bg-emerald-500',
            'Délits moyen': 'bg-orange-500',
            'Délits majeur': 'bg-red-500',
            'Crime': 'bg-purple-600',
            'Objet illégaux et drogues': 'bg-pink-600',
            'Armes': 'bg-slate-600'
        };

        async function init() {
            try {
                
                const response = await fetch('/api/individus?type=lois');
                const data = await response.json();
                
                const tempCats = {};
                data.forEach(item => {
                    if (!tempCats[item.categorie]) {
                        tempCats[item.categorie] = {
                            name: item.categorie,
                            style: categoryStyles[item.categorie] || 'bg-slate-500',
                            items: []
                        };
                    }
                    tempCats[item.categorie].items.push(item);
                });
                categories = Object.values(tempCats);
                
                document.getElementById('loader').remove();
                renderLaws();
            } catch (error) {
                console.error("Erreur chargement Neon:", error);
                document.getElementById('lawCategories').innerHTML = `<div class="text-red-400 p-8 text-center bg-red-900/20 rounded-xl border border-red-500/50">Erreur de connexion à la base de données Neon.</div>`;
            }
        }

        function renderLaws() {
            const container = document.getElementById('lawCategories');
            container.innerHTML = categories.map(cat => `
                <div class="law-section animate-fade-in">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-1 h-6 ${cat.style} rounded-full"></div>
                        <h2 class="text-lg font-extrabold text-white uppercase tracking-wider">${cat.name}</h2>
                        <span class="text-[10px] text-slate-500 font-bold bg-slate-800 px-2 py-0.5 rounded border border-slate-700">${cat.items.length}</span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        ${cat.items.map(law => {
                            const isSelected = selectedItems.find(i => i.id === law.id);
                            return `
                                <div onclick="toggleLaw(${law.id})" 
                                     class="cursor-pointer group relative bg-slate-800/40 hover:bg-slate-700/60 border ${isSelected ? 'border-blue-500 bg-blue-500/10' : 'border-slate-700/50'} p-4 rounded-xl transition-all duration-200">
                                    <div class="flex justify-between items-start gap-4">
                                        <div class="flex-grow">
                                            <h3 class="text-sm font-bold ${isSelected ? 'text-blue-400' : 'text-slate-200'} group-hover:text-white transition-colors">${law.label}</h3>
                                            <p class="text-[10px] text-slate-500 mt-1 italic">${law.sanction || ''}</p>
                                        </div>
                                        <div class="text-right shrink-0">
                                            <div class="text-xs font-black text-emerald-400">${law.amende}$</div>
                                            ${law.prison > 0 ? `<div class="text-[10px] font-bold text-blue-400">${law.prison} min</div>` : ''}
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `).join('');
        }

        function toggleLaw(id) {
            const allItems = categories.flatMap(c => c.items);
            const item = allItems.find(i => i.id === id);
            const index = selectedItems.findIndex(i => i.id === id);

            if (index > -1) {
                selectedItems.splice(index, 1);
            } else {
                selectedItems.push(item);
            }
            updateCalculator();
            renderLaws();
        }

        function updateCalculator() {
            const totalFine = selectedItems.reduce((sum, i) => sum + i.amende, 0);
            const totalPrison = selectedItems.reduce((sum, i) => sum + i.prison, 0);
            const totalBan = selectedItems.reduce((sum, i) => sum + i.ban, 0);

            document.getElementById('totalFine').innerText = totalFine.toLocaleString() + '$';
            document.getElementById('totalPrison').innerText = totalPrison;
            
            const banDisplay = document.getElementById('banDisplay');
            if (totalBan > 0) {
                banDisplay.classList.remove('hidden');
                document.getElementById('totalBan').innerText = totalBan >= 999 ? 'DÉFINITIF' : totalBan + ' Jours';
            } else {
                banDisplay.classList.add('hidden');
            }

            const selectedList = document.getElementById('selectedLaws');
            if (selectedItems.length === 0) {
                selectedList.innerHTML = '<div class="text-center py-4 text-slate-500 text-sm italic">Aucune infraction sélectionnée</div>';
            } else {
                selectedList.innerHTML = selectedItems.map(i => `
                    <div class="flex justify-between items-center bg-slate-800 p-2 rounded-lg border border-slate-700 animate-fade-in">
                        <span class="text-[11px] font-bold text-slate-200 truncate pr-2">${i.label}</span>
                        <button onclick="toggleLaw(${i.id})" class="text-slate-500 hover:text-red-400 text-xs">✕</button>
                    </div>
                `).join('');
            }
        }

        function resetCalculator() {
            selectedItems = [];
            updateCalculator();
            renderLaws();
        }

        function copyToClipboard() {
            if (selectedItems.length === 0) return;
            const text = `--- RAPPORT CPPD ---\n` +
                `Motifs: ${selectedItems.map(i => i.label).join(', ')}\n` +
                `Total Amende: ${document.getElementById('totalFine').innerText}\n` +
                `Peine Prison: ${document.getElementById('totalPrison').innerText} minutes\n` +
                (selectedItems.some(i => i.ban > 0) ? `Sanction Ban: ${document.getElementById('totalBan').innerText}\n` : '') +
                `--------------------`;
            navigator.clipboard.writeText(text);
            alert("Rapport copié !");
        }

        function filterLaws() {
            const query = document.getElementById('searchBar').value.toLowerCase();
            const sections = document.querySelectorAll('.law-section');
            sections.forEach(section => {
                const cards = section.querySelectorAll('.cursor-pointer');
                let hasVisible = false;
                cards.forEach(card => {
                    const label = card.querySelector('h3').innerText.toLowerCase();
                    const visible = label.includes(query);
                    card.style.display = visible ? '' : 'none';
                    if (visible) hasVisible = true;
                });
                section.style.display = hasVisible ? '' : 'none';
            });
        }

        init();
    </script>
</body>
</html>
