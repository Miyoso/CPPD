<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculatrice Pénale CPPD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

<header class="bg-slate-800 p-4 border-b border-slate-700 sticky top-0 z-20 shadow-lg">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
        <h1 class="text-2xl font-bold text-blue-400 tracking-wider">CPPD • BASE DE DONNÉES</h1>
        <input
                type="text"
                id="searchBar"
                placeholder="Chargement des lois..."
                disabled
                class="w-full md:w-1/3 p-2 rounded bg-slate-700 border border-slate-600 focus:outline-none focus:border-blue-500 text-white placeholder-slate-400 transition-opacity opacity-50"
                onkeyup="filterLaws()"
        >
    </div>
</header>

<main class="max-w-6xl mx-auto p-4 flex flex-col-reverse lg:flex-row gap-6 mt-4">

    <div id="lawsContainer" class="flex-1 space-y-6 pb-20">
        <div class="text-center text-slate-500 mt-10 animate-pulse">Récupération des données depuis le Gouv...</div>
    </div>

    <div class="lg:w-96 relative">
        <div class="bg-slate-800 rounded-xl border border-slate-700 p-5 sticky top-24 shadow-2xl">
            <div class="flex justify-between items-center mb-4 pb-4 border-b border-slate-600">
                <h2 class="text-xl font-bold text-white">Sanctions</h2>
                <span id="countBadge" class="bg-blue-900 text-blue-200 text-xs px-2 py-1 rounded-full">0 délits</span>
            </div>

            <div id="cartList" class="mb-6 max-h-[40vh] overflow-y-auto space-y-2 pr-2 text-sm custom-scrollbar">
                <p class="text-slate-500 text-center italic py-4">Sélectionnez des infractions...</p>
            </div>

            <label class="flex items-center space-x-3 mb-6 p-3 rounded-lg border border-slate-600 bg-slate-700 cursor-pointer hover:bg-slate-600 transition-colors" id="firstOffenseLabel">
                <input type="checkbox" id="firstOffenseCheck" class="w-5 h-5 accent-green-500" onchange="calculate()">
                <div class="flex flex-col">
                    <span class="text-green-100 font-bold text-sm">1ère Interpellation</span>
                    <span class="text-green-300 text-xs">Amende / 2 + Pas de Ban</span>
                </div>
            </label>

            <div class="space-y-3">
                <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 flex justify-between items-center">
                    <span class="text-slate-400 text-sm uppercase font-semibold">Amende</span>
                    <span id="totalFine" class="text-2xl font-bold text-green-400">0 $</span>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-slate-900 p-3 rounded-lg border border-slate-700 text-center">
                        <span class="text-slate-400 text-xs uppercase block mb-1">Prison</span>
                        <span id="totalPrison" class="text-lg font-bold text-blue-400">Aucune</span>
                    </div>
                    <div class="bg-slate-900 p-3 rounded-lg border border-slate-700 text-center">
                        <span class="text-slate-400 text-xs uppercase block mb-1">Bannissement</span>
                        <span id="maxBan" class="text-lg font-bold text-slate-500">-</span>
                    </div>
                </div>
            </div>

            <button onclick="resetAll()" class="w-full mt-6 py-3 bg-red-600 hover:bg-red-700 text-white rounded-lg font-bold text-sm uppercase tracking-wide transition-colors shadow-lg">
                Réinitialiser
            </button>
        </div>
    </div>
</main>

<script>
    const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQDxMAqXZPZlHBCccPSU1Wq35l7wMeQdUUEJabIJkdsEjVKnF3gginHkCo6PC5nTfeVtDupnI8ad8su/pub?gid=0&single=true&output=csv";

    let categories = [];
    let cart = [];

    const categoryColors = {
        "Code de la route": "bg-green-100 border-green-500 text-green-900",
        "Délit mineur": "bg-blue-200 border-blue-600 text-blue-900",
        "Délits moyen": "bg-yellow-100 border-yellow-500 text-yellow-900",
        "Délits majeur": "bg-red-200 border-red-600 text-red-900",
        "Crime": "bg-purple-200 border-purple-600 text-purple-900",
        "Objet illégaux et drogues": "bg-orange-200 border-orange-600 text-orange-900",
        "Armes": "bg-gray-300 border-gray-600 text-gray-900"
    };
    const defaultColor = "bg-gray-200 border-gray-600 text-gray-900";

    async function init() {
        try {
            // On ajoute un paramètre anti-cache pour être sûr d'avoir les dernières données
            const response = await fetch(SHEET_URL + "&t=" + Date.now());
            const data = await response.text();
            parseCSV(data);
            renderLaws();

            const searchInput = document.getElementById('searchBar');
            searchInput.disabled = false;
            searchInput.placeholder = "Rechercher (ex: vol, arme...)";
            searchInput.style.opacity = "1";

        } catch (error) {
            document.getElementById('lawsContainer').innerHTML = `<div class="text-red-500 text-center font-bold p-4 border border-red-500 rounded">Erreur de chargement.<br>Vérifie que le lien est bien en format CSV.<br>Erreur: ${error.message}</div>`;
        }
    }

    function parseCSV(csvText) {
        const rows = csvText.split('\n').slice(1);
        const tempCats = {};

        rows.forEach(row => {
            const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);

            if (cols.length < 5) return;

            const catName = cols[0].replace(/"/g, '').trim();
            const label = cols[1].replace(/"/g, '').trim();
            const fine = parseInt(cols[2].replace(/\D/g, '')) || 0;
            const prison = parseInt(cols[3].replace(/\D/g, '')) || 0;
            const ban = parseInt(cols[4].replace(/\D/g, '')) || 0;

            const sanction = cols[5] ? cols[5].replace(/"/g, '').trim() : "";

            if (!catName || !label) return;

            if (!tempCats[catName]) {
                tempCats[catName] = {
                    name: catName,
                    colorClass: categoryColors[catName] || defaultColor,
                    items: []
                };
            }
            // On ajoute la sanction à l'objet
            tempCats[catName].items.push({ label, fine, prison, ban, sanction });
        });
        categories = Object.values(tempCats);
    }

    function renderLaws() {
        const container = document.getElementById('lawsContainer');
        container.innerHTML = '';

        if(categories.length === 0) {
            container.innerHTML = '<div class="text-center text-slate-400">Aucune donnée trouvée. Vérifie ton Google Sheet.</div>';
            return;
        }

        categories.forEach((cat, catIndex) => {
            const section = document.createElement('div');
            section.className = 'law-category mb-6';

            const title = document.createElement('h2');
            title.className = `text-lg font-bold px-4 py-2 rounded-t-lg border-b-2 ${cat.colorClass}`;
            title.innerText = cat.name;
            section.appendChild(title);

            const grid = document.createElement('div');
            grid.className = 'grid grid-cols-1 md:grid-cols-2 gap-2 bg-slate-800 p-3 rounded-b-lg border border-slate-700';

            cat.items.forEach((item, itemIndex) => {
                const btn = document.createElement('button');
                const uniqueId = `btn-${catIndex}-${itemIndex}`;
                btn.id = uniqueId;

                btn.className = 'law-item flex justify-between items-center p-3 rounded text-sm font-medium transition-all duration-200 border bg-slate-700 border-transparent hover:bg-slate-600 text-slate-200';
                btn.onclick = () => toggleItem(catIndex, itemIndex, uniqueId);

                btn.innerHTML = `
                        <div class="flex flex-col items-start">
                            <span class="text-left">${item.label}</span>
                            ${item.sanction ? `<span class="text-xs text-orange-400 text-left mt-1 italic opacity-80">⚠️ ${item.sanction}</span>` : ''}
                        </div>
                        <span class="ml-2 font-mono opacity-70 whitespace-nowrap">${item.fine.toLocaleString()}$</span>
                    `;
                grid.appendChild(btn);
            });

            section.appendChild(grid);
            container.appendChild(section);
        });
    }

    function toggleItem(catIndex, itemIndex, btnId) {
        const item = categories[catIndex].items[itemIndex];
        const btn = document.getElementById(btnId);

        const existingIndex = cart.findIndex(i => i.label === item.label);

        if (existingIndex > -1) {
            cart.splice(existingIndex, 1);
            btn.className = 'law-item flex justify-between items-center p-3 rounded text-sm font-medium transition-all duration-200 border bg-slate-700 border-transparent hover:bg-slate-600 text-slate-200';
        } else {
            cart.push(item);
            btn.className = 'law-item flex justify-between items-center p-3 rounded text-sm font-medium transition-all duration-200 border bg-blue-600 border-blue-400 text-white shadow-[0_0_10px_rgba(37,99,235,0.5)] transform scale-[1.02]';
        }
        calculate();
    }

    function calculate() {
        const list = document.getElementById('cartList');
        const badge = document.getElementById('countBadge');

        list.innerHTML = '';
        badge.innerText = `${cart.length} délits`;

        if (cart.length === 0) {
            list.innerHTML = '<p class="text-slate-500 text-center italic py-4">Sélectionnez des infractions...</p>';
        } else {
            cart.forEach(item => {
                const row = document.createElement('div');
                row.className = 'bg-slate-700/50 p-2 rounded flex flex-col gap-1 border border-slate-600';


                let content = `
                        <div class="flex justify-between text-sm text-slate-200 font-semibold">
                            <span>${item.label}</span>
                            <span>${item.fine}$</span>
                        </div>
                    `;


                if (item.sanction) {
                    content += `
                            <div class="text-xs text-orange-300 italic border-t border-slate-600 pt-1 mt-1">
                                ➤ ${item.sanction}
                            </div>
                        `;
                }

                row.innerHTML = content;
                list.appendChild(row);
            });
        }

        let totalFine = cart.reduce((acc, item) => acc + item.fine, 0);
        const totalPrison = cart.reduce((acc, item) => acc + item.prison, 0);
        let maxBan = cart.reduce((max, item) => (item.ban > max ? item.ban : max), 0);

        const isFirstOffense = document.getElementById('firstOffenseCheck').checked;
        const offenseLabel = document.getElementById('firstOffenseLabel');

        if (isFirstOffense) {
            totalFine = Math.floor(totalFine / 2);
            if (maxBan < 999) {
                maxBan = 0;
            }
            offenseLabel.className = "flex items-center space-x-3 mb-6 p-3 rounded-lg border cursor-pointer transition-colors bg-green-900/40 border-green-500";
        } else {
            offenseLabel.className = "flex items-center space-x-3 mb-6 p-3 rounded-lg border border-slate-600 bg-slate-700 cursor-pointer hover:bg-slate-600 transition-colors";
        }

        document.getElementById('totalFine').innerText = totalFine.toLocaleString() + " $";

        if (totalPrison > 0) {
            document.getElementById('totalPrison').innerText = totalPrison + " Minutes";
        } else {
            document.getElementById('totalPrison').innerText = "Aucune";
        }

        const banEl = document.getElementById('maxBan');
        if (maxBan >= 999) {
            banEl.innerText = "DÉFINITIF";
            banEl.className = "text-lg font-bold text-red-500 animate-pulse";
        } else if (maxBan > 0) {
            banEl.innerText = maxBan + " Jours";
            banEl.className = "text-lg font-bold text-red-400";
        } else {
            banEl.innerText = "Aucun";
            banEl.className = "text-lg font-bold text-green-400";
        }
    }

    function filterLaws() {
        const term = document.getElementById('searchBar').value.toLowerCase();
        const categoriesDivs = document.getElementsByClassName('law-category');

        Array.from(categoriesDivs).forEach(catDiv => {
            const buttons = catDiv.getElementsByTagName('button');
            let hasVisible = false;

            Array.from(buttons).forEach(btn => {
                const text = btn.innerText.toLowerCase();
                if (text.includes(term)) {
                    btn.style.display = "flex";
                    hasVisible = true;
                } else {
                    btn.style.display = "none";
                }
            });
            catDiv.style.display = hasVisible ? "block" : "none";
        });
    }

    function resetAll() {
        cart = [];
        document.getElementById('firstOffenseCheck').checked = false;
        const buttons = document.getElementsByClassName('law-item');
        Array.from(buttons).forEach(btn => {
            btn.className = 'law-item flex justify-between items-center p-3 rounded text-sm font-medium transition-all duration-200 border bg-slate-700 border-transparent hover:bg-slate-600 text-slate-200';
        });
        calculate();
    }

    init();
</script>
</body>
</html>
