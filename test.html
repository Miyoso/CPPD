<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>TEST NEON DB</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-10">

    <div class="max-w-2xl mx-auto space-y-10">
        <h1 class="text-2xl font-bold border-b pb-2">Diagnostic de Connexion Neon</h1>

        <section class="bg-slate-800 p-6 rounded-xl border border-slate-700">
            <h2 class="text-lg mb-4 font-semibold text-blue-400">1. Envoyer une donnée</h2>
            <form id="testForm" class="flex gap-2">
                <input type="text" id="testNom" placeholder="Nom de test" required class="bg-slate-900 p-2 rounded flex-grow border border-slate-700">
                <button type="submit" class="bg-blue-600 px-4 py-2 rounded font-bold hover:bg-blue-500">Envoyer</button>
            </form>
            <p id="sendStatut" class="mt-2 text-sm"></p>
        </section>

        <section class="bg-slate-800 p-6 rounded-xl border border-slate-700">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-emerald-400">2. Données en Base</h2>
                <button onclick="fetchTest()" class="text-xs bg-slate-700 px-2 py-1 rounded">Actualiser</button>
            </div>
            <ul id="testList" class="space-y-2 text-sm font-mono text-slate-400">
                <li>Chargement...</li>
            </ul>
        </section>
    </div>

    <script>
        // Fonction pour lire
        async function fetchTest() {
            const list = document.getElementById('testList');
            try {
                const res = await fetch('/api/individus');
                if (!res.ok) throw new Error(`Erreur HTTP: ${res.status}`);
                const data = await res.json();
                
                if (data.length === 0) {
                    list.innerHTML = "<li>La base est vide (aucune ligne dans la table).</li>";
                } else {
                    list.innerHTML = data.map(i => `
                        <li class="bg-slate-900 p-2 rounded border border-slate-800">
                            ID: ${i.id} | NOM: ${i.nom || 'N/A'} | MOTIF: ${i.motif || 'N/A'}
                        </li>
                    `).join('');
                }
            } catch (err) {
                list.innerHTML = `<li class="text-red-500 italic">Erreur: ${err.message}</li>`;
            }
        }

        // Fonction pour écrire
        document.getElementById('testForm').onsubmit = async (e) => {
            e.preventDefault();
            const status = document.getElementById('sendStatut');
            status.innerText = "Envoi...";
            
            const body = {
                nom: document.getElementById('testNom').value,
                telephone: "TEST",
                statut: "En règle",
                motif: "Test de connexion",
                derniere_intervention: new Date().toLocaleDateString('fr-FR'),
                casiers: "Donnée de test"
            };

            try {
                const res = await fetch('/api/individus', {
                    method: 'POST',
                    body: JSON.stringify(body)
                });
                
                if (res.ok) {
                    status.className = "mt-2 text-sm text-emerald-400";
                    status.innerText = "Succès ! Donnée enregistrée.";
                    e.target.reset();
                    fetchTest();
                } else {
                    throw new Error("L'API a répondu avec une erreur.");
                }
            } catch (err) {
                status.className = "mt-2 text-sm text-red-400";
                status.innerText = "Erreur: " + err.message;
            }
        };

        fetchTest();
    </script>
</body>
</html>
