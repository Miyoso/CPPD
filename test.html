<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inside Roleplay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        
        .bg-overlay {
            /* On utilise bien fond.png */
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.7)), 
                        url('fond.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed; /* Garde le fond fixe au scroll */
        }

        /* Animation douce pour le logo */
        .logo-glow {
            filter: drop-shadow(0 0 20px rgba(234, 88, 12, 0.4));
            transition: transform 0.3s ease;
        }
        .logo-glow:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body class="bg-black text-white h-screen flex flex-col bg-overlay">

    <nav class="flex items-center justify-between px-6 md:px-10 py-5 bg-black/40 backdrop-blur-md border-b border-white/10">
        <div class="flex items-center gap-3">
            <img src="logo.png" alt="Mini Logo" class="w-10 h-10 object-contain">
            <div>
                <h1 class="font-bold leading-none text-lg">Inside Roleplay</h1>
                <span class="text-[10px] md:text-xs text-green-400 flex items-center gap-1">
                    <span class="animate-pulse">●</span> Aucun joueur connecté
                </span>
            </div>
        </div>

        <ul class="hidden lg:flex gap-8 text-sm font-medium text-gray-300">
            <li class="hover:text-white cursor-pointer transition">Accueil</li>
            <li class="hover:text-white cursor-pointer transition">Communauté</li>
            <li class="hover:text-white cursor-pointer transition">Discord</li>
            <li class="hover:text-white cursor-pointer transition">Staff</li>
            <li class="hover:text-white cursor-pointer transition">Wiki</li>
            <li class="hover:text-white cursor-pointer transition text-orange-400">Boutique</li>
        </ul>

        <div class="flex gap-3">
            <button class="px-4 py-2 border border-red-500/50 bg-red-500/20 rounded-lg text-sm font-semibold hover:bg-red-600 transition">Jouer</button>
            <button class="hidden sm:block px-4 py-2 bg-indigo-600/30 border border-indigo-500/50 rounded-lg text-sm font-semibold hover:bg-indigo-600 transition">Discord</button>
        </div>
    </nav>

    <main class="flex-1 flex flex-col items-center justify-center text-center px-4">
        <div class="mb-8">
             <img src="logo.png" alt="Logo" class="w-40 h-40 md:w-56 md:h-56 logo-glow">
        </div>

        <h2 class="text-5xl md:text-8xl font-extrabold tracking-tighter mb-10 drop-shadow-2xl">
            INSIDE <span class="text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-pink-600">ROLEPLAY</span>
        </h2>

        <div class="flex flex-col md:flex-row gap-6">
            <button class="group flex items-center justify-center gap-3 px-10 py-4 bg-red-600 rounded-full font-bold text-lg shadow-2xl shadow-red-600/30 hover:bg-red-500 transition-all">
                <span>🚀</span> Rejoindre le Serveur
            </button>
            <button class="flex items-center justify-center gap-3 px-10 py-4 bg-white/10 backdrop-blur-md border border-white/20 rounded-full font-bold text-lg hover:bg-white/20 transition-all">
                <span>💬</span> Rejoindre le Discord
            </button>
        </div>
    </main>

    <div class="p-6 flex justify-between items-center opacity-70">
        <button class="p-3 border border-white/20 rounded-full hover:bg-white/10 transition">🔇</button>
        <button class="p-3 border border-white/20 rounded-full hover:bg-white/10 transition">👁️</button>
    </div>

</body>
</html>
