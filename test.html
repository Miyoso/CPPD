<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPPD • Terminal de Justice</title>
    <link rel="icon" type="image/png" href="LogoCPPD.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass: rgba(15, 23, 42, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-blue: #3b82f6;
        }

        body { 
            background: radial-gradient(circle at 50% 0%, #1e293b 0%, #020617 100%);
            background-color: #020617;
            color: #cbd5e1;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 600px; height: 600px;
            background-image: url('LogoCPPD.png'); background-repeat: no-repeat;
            background-position: center; background-size: contain;
            opacity: 0.03; pointer-events: none; z-index: -1;
        }

        .glass {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 1.5rem;
            transition: all 0.3s ease;
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.4) !important;
            border: 1px solid var(--glass-border) !important;
            color: white !important;
            outline: none;
        }

        .glass-input:focus { border-color: var(--accent-blue) !important; }

        .ticket-receipt {
            background: #f8fafc;
            color: #1e293b;
            padding: 24px;
            font-family: 'JetBrains Mono', monospace;
            border-radius: 4px;
        }

        .filter-btn.active { background: var(--accent-blue); color: white; }
        
        .scanline {
            width: 100%; height: 2px;
            background: rgba(59, 130, 246, 0.05);
            position: fixed; top: 0; z-index: 100;
            animation: scan 6s linear infinite;
        }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="scanline"></div>

    <header class="max-w-7xl mx-auto glass rounded-[2rem] p-6 mb-8 flex flex-col md:flex-row justify-between items-center gap-6 shadow-2xl">
        <div class="flex items-center gap-5">
            <img src="LogoCPPD.png" class="w-12 h-12 object-contain drop-shadow-[0_0_8px_rgba(59,130,246,0.4)]">
            <div>
                <h1 class="text-2xl font-black text-white tracking-tighter uppercase italic">Central Database</h1>
                <p class="text-[10px] font-bold text-blue-400 uppercase tracking-widest">Calculateur Pénal • Intelligence</p>
            </div>
        </div>
        <div class="flex gap-3">
            <a href="Individus.html" class="glass-card px-6 py-2.5 text-[10px] font-bold uppercase hover:bg-blue-600 transition-all">Individus</a>
            <a href="Logs.html" class="glass-card px-6 py-2.5 text-[10px] font-bold uppercase hover:bg-red-600 transition-all">Logs</a>
            <a href="Plainte.html" class="glass-card px-6 py-2.5 text-[10px] font-bold uppercase hover:bg-slate-600 transition-all">Plaintes</a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-2 space-y-6">
            <div class="glass-card p-4">
                <div class="relative w-full">
                    <input type="text" id="searchBar" onkeyup="filterLaws()" placeholder="Rechercher une infraction ou un article..." class="glass-input w-full rounded-xl p-4 pl-12 text-sm">
                    <svg class="w-5 h-5 text-slate-500 absolute left-4 top-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
            </div>

            <div id="filterContainer" class="flex flex-wrap gap-2">
                <button onclick="filterByCategory('all')" class="filter-btn active px-4 py-2 rounded-full border border-white/10 text-[9px] font-black uppercase tracking-widest transition-all">Tous</button>
            </div>

            <div id="lawsContainer" class="space-y-8 pb-20"></div>
        </div>

        <aside class="space-y-6">
            <div class="ticket-receipt shadow-2xl">
                <div class="text-center border-b border-dashed border-slate-400 pb-4 mb-4">
                    <h2 class="text-sm font-black uppercase tracking-tighter">Procès-Verbal Officiel</h2>
                    <p class="text-[9px] opacity-70" id="ticketDate">--/--/----</p>
                </div>
                
                <div id="cartList" class="space-y-2 text-[10px] mb-6 min-h-[50px]"></div>

                <div class="border-t border-dashed border-slate-400 pt-4 space-y-2 mb-6">
                    <div class="flex justify-between font-black text-lg">
                        <span>AMENDE</span>
                        <span id="totalFine">0 $</span>
                    </div>
                    <div class="flex justify-between text-[11px] font-bold text-blue-800">
                        <span>CELLULE</span>
                        <span id="totalPrison">0 Min</span>
                    </div>
                </div>

                <button onclick="copyReport()" class="w-full bg-slate-200 border-2 border-slate-400 text-slate-800 font-bold py-3 rounded text-[10px] uppercase hover:bg-slate-300 transition-all">
                    Copier le rapport
                </button>
            </div>

            <div class="glass-card p-6 space-y-4">
                <h3 class="text-xs font-black text-white uppercase tracking-widest border-l-2 border-blue-500 pl-3">Suspect</h3>
                
                <label class="flex items-center gap-3 p-3 rounded-xl glass-input cursor-pointer">
                    <input type="checkbox" id="firstOffenseCheck" onchange="calculate()" class="w-4 h-4 rounded accent-blue-500">
                    <span class="text-[10px] font-bold uppercase text-slate-300">1ère Interpellation (-50%)</span>
                </label>

                <input type="text" id="suspectNom" placeholder="Nom Prénom" class="glass-input w-full rounded-xl p-3 text-sm">
                <input type="text" id="suspectTel" placeholder="Téléphone" class="glass-input w-full rounded-xl p-3 text-sm">
                <input type="text" id="suspectPhoto" placeholder="Lien Photo (URL)" class="glass-input w-full rounded-xl p-3 text-sm">
                
                <select id="suspectStatut" class="glass-input w-full rounded-xl p-3 text-sm">
                    <option value="En règle">En règle</option>
                    <option value="Recherché">Recherché</option>
                </select>

                <button onclick="saveSuspect()" id="saveBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-xl transition-all uppercase text-[10px] tracking-widest shadow-lg shadow-blue-900/40">
                    Valider & Archiver
                </button>
            </div>
        </aside>
    </main>

    <script>
        let categories = [];
        let cart = [];
        const styles = { 
            "Code de la route": "border-emerald-500/30 bg-emerald-500/5", 
            "Délit mineur": "border-blue-500/30 bg-blue-500/5", 
            "Délits moyen": "border-yellow-500/30 bg-yellow-500/5", 
            "Délits majeur": "border-red-500/30 bg-red-500/5", 
            "Objet illégaux et drogues": "border-orange-500/30 bg-orange-500/5",
            "Armes": "border-slate-500/30 bg-slate-500/5",
            "Crime": "border-purple-500/30 bg-purple-500/5"
        };

        function cleanText(text) {
            return text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        async function init() {
            document.getElementById('ticketDate').innerText = new Date().toLocaleString('fr-FR');
            const res = await fetch('/api/individus?type=lois');
            const data = await res.json();
            const temp = {};
            data.forEach(i => {
                if(!temp[i.categorie]) temp[i.categorie] = { name: i.categorie, style: styles[i.categorie] || "", items: [] };
                temp[i.categorie].items.push(i);
            });
            categories = Object.values(temp);
            renderFilters();
            renderLaws();
        }

        function renderFilters() {
            const container = document.getElementById('filterContainer');
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn px-4 py-2 rounded-full border border-white/10 text-[9px] font-black uppercase tracking-widest transition-all';
                btn.innerText = cat.name;
                btn.onclick = () => filterByCategory(cat.name, btn);
                container.appendChild(btn);
            });
        }

        function filterByCategory(name, element) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            if (element) element.classList.add('active');
            document.getElementById('searchBar').value = "";
            document.querySelectorAll('.law-group').forEach(c => {
                c.style.display = (name === 'all' || c.getAttribute('data-category') === name) ? "" : "none";
                c.querySelectorAll('button').forEach(b => b.style.display = "");
            });
        }

        function filterLaws() {
            const t = cleanText(document.getElementById('searchBar').value);
            document.querySelectorAll('.law-group').forEach(c => {
                let hasMatch = false;
                c.querySelectorAll('button').forEach(b => { 
                    const match = cleanText(b.innerText).includes(t);
                    b.style.display = match ? "" : "none"; 
                    if(match) hasMatch = true; 
                });
                c.style.display = hasMatch ? "" : "none";
            });
        }

        function renderLaws() {
            const container = document.getElementById('lawsContainer');
            container.innerHTML = categories.map(cat => `
                <div class="law-group" data-category="${cat.name}">
                    <h2 class="text-[10px] font-black uppercase tracking-[0.3em] text-slate-500 mb-4 ml-2">${cat.name}</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        ${cat.items.map(i => {
                            const useQty = cat.name === "Objet illégaux et drogues" && !i.label.toLowerCase().includes("matériel");
                            return `
                            <button onclick="toggleItem(${i.id}, ${useQty})" id="law-${i.id}" class="glass-card p-4 text-left border-l-4 ${cat.style} relative group">
                                <div class="flex justify-between items-start mb-1">
                                    <span class="text-xs font-bold text-white">${i.label} ${useQty ? '<span class="text-orange-400">(Qté)</span>' : ''}</span>
                                    <span class="text-[10px] font-mono text-blue-400 font-bold">${i.amende}$</span>
                                </div>
                                ${i.sanction ? `<p class="text-[9px] text-slate-400 italic leading-tight">${i.sanction}</p>` : ''}
                                <div id="badge-${i.id}" class="hidden absolute -top-2 -right-2 bg-blue-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full z-10">x1</div>
                                <div class="selection-indicator absolute inset-0 border-2 border-blue-500 rounded-2xl opacity-0 transition-all pointer-events-none"></div>
                            </button>`;
                        }).join('')}
                    </div>
                </div>`).join('');
        }

        function toggleItem(id, askQty = false) {
            const item = categories.flatMap(c => c.items).find(i => i.id === id);
            const idx = cart.findIndex(i => i.id === id);
            const el = document.getElementById(`law-${id}`).querySelector('.selection-indicator');
            const badge = document.getElementById(`badge-${id}`);

            if(idx > -1) {
                cart.splice(idx, 1);
                el.classList.replace('opacity-100', 'opacity-0');
                badge.classList.add('hidden');
            } else {
                let qty = 1;
                if(askQty) {
                    const input = prompt(`Quantité pour : ${item.label}`, "1");
                    qty = parseInt(input) || 1;
                    if(qty <= 0) return;
                }
                cart.push({ ...item, qty: qty });
                el.classList.replace('opacity-0', 'opacity-100');
                if(qty > 1) { badge.innerText = `x${qty}`; badge.classList.remove('hidden'); }
            }
            calculate();
        }

        function calculate() {
            let f = cart.reduce((a, i) => a + (i.amende * (i.qty || 1)), 0);
            let p = cart.reduce((a, i) => a + i.prison, 0);
            if(document.getElementById('firstOffenseCheck').checked) f = Math.floor(f/2);
            document.getElementById('totalFine').innerText = f.toLocaleString() + " $";
            document.getElementById('totalPrison').innerText = p + " Min";
            document.getElementById('cartList').innerHTML = cart.map(i => `
                <div class="flex justify-between border-b border-slate-200 pb-1 uppercase">
                    <span>${i.label} ${i.qty > 1 ? '(x'+i.qty+')' : ''}</span>
                    <span class="font-bold">${(i.amende * (i.qty || 1)).toLocaleString()}$</span>
                </div>`).join('');
        }

        async function saveSuspect() {
            const nom = document.getElementById('suspectNom').value;
            if(!nom || !cart.length) return alert("Nom et infractions requis.");
            const body = { 
                nom, telephone: document.getElementById('suspectTel').value || "Inconnu", statut: document.getElementById('suspectStatut').value,
                photo_url: document.getElementById('suspectPhoto').value || "", motif: cart.map(i => `${i.label}${i.qty > 1 ? ' (x'+i.qty+')' : ''}`).join(', '), 
                casiers: `Amende: ${document.getElementById('totalFine').innerText} | Prison: ${document.getElementById('totalPrison').innerText}`, 
                derniere_intervention: new Date().toLocaleDateString('fr-FR') 
            };
            const res = await fetch('/api/individus', { method: 'POST', body: JSON.stringify(body) });
            if(res.ok) window.location.href = "Individus.html";
        }

        function copyReport() {
            const nom = document.getElementById('suspectNom').value || "Inconnu";
            const report = `📋 **RAPPORT CPPD**\n👤 **Suspect :** ${nom}\n⚖️ **Amende :** ${document.getElementById('totalFine').innerText}\n⏳ **Temps :** ${document.getElementById('totalPrison').innerText}`;
            navigator.clipboard.writeText(report); alert("Rapport copié !");
        }

        init();
    </script>
</body>
</html>
