<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPPD • Armurerie Centrale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --glass: rgba(15, 23, 42, 0.75); --glass-border: rgba(255, 255, 255, 0.1); --accent-blue: #3b82f6; }
        body { background: radial-gradient(circle at 50% 0%, #1e293b 0%, #020617 100%); background-color: #020617; color: #cbd5e1; font-family: 'Inter', sans-serif; min-height: 100vh; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 1.5rem; transition: all 0.3s ease; }
        .glass-input { background: rgba(0, 0, 0, 0.4) !important; border: 1px solid var(--glass-border) !important; color: white !important; outline: none; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8">
    <header class="max-w-7xl mx-auto glass-card p-6 mb-8 flex justify-between items-center shadow-2xl">
        <div class="flex items-center gap-5">
            <img src="LogoCPPD.png" class="w-12 h-12 object-contain">
            <h1 class="text-2xl font-black text-white italic uppercase tracking-tighter">Gestion de l'Armement</h1>
        </div>
        <a href="index.html" class="glass-card px-8 py-3 text-xs font-bold uppercase hover:bg-blue-600 transition-all">Retour Terminal</a>
    </header>

    <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        <section class="glass-card p-6 space-y-4">
            <h2 class="text-xs font-black uppercase text-blue-400 tracking-widest border-l-2 border-blue-500 pl-3">Enregistrement Matériel</h2>
            <input type="text" id="modele" placeholder="Modèle (ex: Glock 17)" class="glass-input w-full rounded-xl p-3 text-sm">
            <input type="text" id="serial" placeholder="Numéro de Série Unique" class="glass-input w-full rounded-xl p-3 text-sm">
            <input type="text" id="agent" placeholder="Agent Détenteur (Optionnel)" class="glass-input w-full rounded-xl p-3 text-sm">
            <button onclick="addWeapon()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-xl transition-all uppercase text-[10px] tracking-widest shadow-lg">Enregistrer l'Arme</button>
        </section>

        <section class="lg:col-span-2 glass-card overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-white/5 text-[10px] uppercase font-black text-slate-500 tracking-widest">
                    <tr>
                        <th class="p-6">Modèle Matériel</th>
                        <th class="p-6">Numéro de Série</th>
                        <th class="p-6">Détenteur</th>
                        <th class="p-6">État</th>
                        <th class="p-6">Statut</th>
                    </tr>
                </thead>
                <tbody id="stockTable" class="text-sm divide-y divide-white/5"></tbody>
            </table>
        </section>
    </main>

    <script>
        async function loadStock() {
            try {
                const res = await fetch('/api/individus?type=stock');
                const data = await res.json();
                document.getElementById('stockTable').innerHTML = data.map(w => {
                    const isAssigned = w.agent_detenteur && w.agent_detenteur !== 'En Stock';
                    return `
                    <tr class="hover:bg-white/5 transition-colors">
                        <td class="p-6 font-bold text-white">${w.modele}</td>
                        <td class="p-6 font-mono text-xs text-blue-400 uppercase">${w.numero_serie}</td>
                        <td class="p-6">
                            <select onchange="updateWeapon(${w.id}, this.value, '${w.etat}')" 
                                    class="bg-slate-900 text-xs text-slate-300 rounded border border-white/10 p-1 outline-none focus:border-blue-500">
                                <option value="En Stock" ${!isAssigned ? 'selected' : ''}>📦 EN STOCK</option>
                                <option value="${isAssigned ? w.agent_detenteur : 'Nouvel Agent'}" ${isAssigned ? 'selected' : 'disabled'}>
                                    ${isAssigned ? '👤 ' + w.agent_detenteur : '⚠️ Non attribuée'}
                                </option>
                                <option value="PROMPT_NEW">➕ Attribuer à un agent...</option>
                            </select>
                        </td>
                        <td class="p-6">
                            <select onchange="updateWeapon(${w.id}, '${w.agent_detenteur}', this.value)"
                                    class="bg-slate-900 text-[9px] font-black rounded px-2 py-1 outline-none border border-white/10">
                                <option value="Neuf" ${w.etat === 'Neuf' ? 'selected' : ''}>NEUF</option>
                                <option value="Bon état" ${w.etat === 'Bon état' ? 'selected' : ''}>BON ÉTAT</option>
                                <option value="Usé" ${w.etat === 'Usé' ? 'selected' : ''}>USÉ</option>
                                <option value="Abîmé" ${w.etat === 'Abîmé' ? 'selected' : ''}>ABÎMÉ</option>
                            </select>
                        </td>
                        <td class="p-6">
                            <span class="px-3 py-1 rounded-lg border text-[9px] font-black ${isAssigned ? 'border-orange-500/30 text-orange-400 bg-orange-500/5' : 'border-emerald-500/30 text-emerald-400 bg-emerald-500/5'}">
                                ${isAssigned ? 'EN SERVICE' : 'STOCK'}
                            </span>
                        </td>
                    </tr>`;
                }).join('');
            } catch (e) { console.error(e); }
        }

        async function updateWeapon(id, agent, etat) {
            let finalAgent = agent;
            if (agent === "PROMPT_NEW") {
                const nouveau = prompt("Matricule de l'agent :");
                if (!nouveau) return loadStock();
                finalAgent = nouveau;
            }
            try {
                await fetch(`/api/individus?type=update_weapon&id_arme=${id}`, {
                    method: 'PATCH',
                    body: JSON.stringify({ agent: finalAgent, etat: etat })
                });
                loadStock();
            } catch (e) { alert("Erreur mise à jour"); }
        }

        async function addWeapon() {
            const body = {
                modele: document.getElementById('modele').value,
                numero_serie: document.getElementById('serial').value,
                agent_detenteur: document.getElementById('agent').value || 'En Stock'
            };
            if(!body.modele || !body.numero_serie) return alert("Données manquantes");
            try {
                await fetch('/api/individus?type=add_weapon', { method: 'POST', body: JSON.stringify(body) });
                document.getElementById('modele').value = '';
                document.getElementById('serial').value = '';
                document.getElementById('agent').value = '';
                loadStock();
            } catch (e) { alert("Erreur enregistrement"); }
        }
        loadStock();
    </script>
</body>
</html>
