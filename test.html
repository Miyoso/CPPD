<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPPD • Générateur de Plainte</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="LogoCPPD.png">
    <style>
        :root { --glass: rgba(15, 23, 42, 0.75); --glass-border: rgba(255, 255, 255, 0.1); }
        body { background: radial-gradient(circle at 50% 0%, #1e293b 0%, #020617 100%); background-color: #020617; color: #cbd5e1; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; }
        
        .glass { background: var(--glass); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 1.5rem; }
        
        .form-column { height: calc(100vh - 80px); overflow-y: auto; padding: 2rem; }
        .preview-column { height: calc(100vh - 80px); overflow-y: auto; display: flex; justify-content: center; padding: 2rem; background: rgba(0,0,0,0.2); }

        .input-field { width: 100%; background: rgba(0, 0, 0, 0.4) !important; border: 1px solid var(--glass-border) !important; border-radius: 0.75rem; padding: 0.75rem; color: white !important; outline: none; }

        /* REGLAGE MULTI-PAGE */
        .document-print { 
            background: white; 
            color: #1a1a1a; 
            width: 210mm; 
            min-height: 297mm; /* Permet au contenu de s'étendre */
            padding: 20mm;
            display: flex;
            flex-direction: column;
            transform: scale(0.55);
            transform-origin: top center;
            position: relative;
        }

        /* Empêche les sections d'être coupées maladroitement entre deux pages */
        section { page-break-inside: avoid; margin-bottom: 20px; }
        
        .watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-30deg); width: 500px; height: 500px; background: url('LogoCPPD.png') no-repeat center/contain; opacity: 0.04; pointer-events: none; }
        .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .section-line { height: 1px; background: #e2e8f0; flex-grow: 1; }
        .section-title { font-size: 10px; font-weight: 800; text-transform: uppercase; color: #0f172a; }
        
        #preview-faits, #preview-menaces, #preview-demandes { white-space: pre-wrap; word-break: break-word; text-align: justify; font-size: 11px; line-height: 1.6; color: #334155; }
    </style>
</head>
<body class="flex flex-col">

    <header class="h-20 glass flex items-center px-8 justify-between z-50">
        <div class="flex items-center gap-5">
            <img src="LogoCPPD.png" class="w-10 h-10 object-contain">
            <div>
                <h1 class="text-white font-black uppercase italic text-sm">C.P.P.D Records</h1>
            </div>
        </div>
        <div class="flex gap-3">
            <a href="index.html" class="glass-card px-5 py-2 text-[9px] font-bold uppercase hover:bg-blue-600 transition-all">Calculateur</a>
            <button id="download-btn" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-xl font-black text-[9px] uppercase shadow-lg">Exporter PDF Multi-Page</button>
        </div>
    </header>

    <main class="flex flex-1 overflow-hidden">
        <div class="w-[40%] form-column border-r border-white/5">
            <div class="space-y-6">
                <input type="text" id="plaignant" placeholder="Nom du Plaignant" class="input-field">
                <input type="text" id="accuse" placeholder="Nom de l'Accusé" class="input-field">
                <input type="text" id="objet" placeholder="Objet" class="input-field">
                <textarea id="faits" rows="10" class="input-field resize-none" placeholder="Récit des faits (Si très long, le PDF créera une page 2 automatiquement)"></textarea>
                <textarea id="qualifications" rows="3" class="input-field resize-none" placeholder="Qualifications..."></textarea>
                <textarea id="demandes" rows="3" class="input-field resize-none" placeholder="Demandes..."></textarea>
            </div>
        </div>

        <div class="w-[60%] preview-column">
            <div id="document-preview" class="document-print">
                <div class="watermark"></div>
                
                <div class="flex justify-between items-start mb-12">
                    <div class="space-y-1">
                        <div class="text-[10px] font-black italic">ÉTAT DE CAYO PERICO</div>
                        <p class="text-[10px] font-bold">Déclarant : <span id="preview-plaignant">...</span></p>
                    </div>
                    <img src="LogoCPPD.png" class="w-16 h-16">
                </div>

                <div class="text-center border-4 border-gray-100 p-4 mb-10">
                    <h1 class="text-xl font-black uppercase">Plainte Formelle</h1>
                </div>

                <div class="space-y-8">
                    <section>
                        <div class="section-header"><span class="section-title">01. Mis en cause</span><div class="section-line"></div></div>
                        <p class="text-[11px] pl-4">Contre : <span id="preview-accuse" class="font-bold underline">...</span></p>
                    </section>

                    <section>
                        <div class="section-header"><span class="section-title">02. Exposé des faits</span><div class="section-line"></div></div>
                        <div id="preview-faits" class="pl-4">En attente...</div>
                    </section>

                    <section>
                        <div class="section-header"><span class="section-title">03. Qualifications</span><div class="section-line"></div></div>
                        <ul id="list-qualifications" class="list-disc ml-10 text-[10px] font-bold text-blue-900"></ul>
                    </section>

                    <section>
                        <div class="section-header"><span class="section-title">04. Prétentions</span><div class="section-line"></div></div>
                        <div id="preview-demandes" class="pl-4 italic">...</div>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <script>
        const inputs = ['plaignant', 'objet', 'accuse', 'faits', 'demandes', 'qualifications'];
        
        inputs.forEach(id => {
            document.getElementById(id).addEventListener('input', (e) => {
                const val = e.target.value;
                if (id === 'qualifications') {
                    document.getElementById('list-qualifications').innerHTML = val.split('\n').filter(l => l.trim()).map(l => `<li>${l}</li>`).join('');
                } else {
                    const prev = document.getElementById('preview-' + id);
                    if (prev) prev.innerText = val || "...";
                }
            });
        });

        document.getElementById('download-btn').addEventListener('click', () => {
            const el = document.getElementById('document-preview');
            const originalTransform = el.style.transform;
            
            el.style.transform = "scale(1)"; // Reset scale pour la capture
            
            const opt = {
                margin: 10, // Marges sur chaque page
                filename: 'Plainte_MultiPage.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                // ACTION CLEF : Gère la coupure intelligente des pages
                pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
            };

            html2pdf().set(opt).from(el).save().then(() => {
                el.style.transform = originalTransform;
            });
        });
    </script>
</body>
</html>
