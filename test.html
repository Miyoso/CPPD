<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inside Roleplay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .bg-overlay {
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.7)), 
                        url('fond.png');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-black text-white h-screen flex flex-col bg-overlay">

    <nav class="flex items-center justify-between px-10 py-5 bg-black/40 backdrop-blur-md">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gradient-to-tr from-pink-500 to-orange-400 rounded-full"></div>
            <div>
                <h1 class="font-bold leading-none">Inside Roleplay</h1>
                <span class="text-xs text-green-400">● Aucun joueur connecté</span>
            </div>
        </div>

        <ul class="hidden md:flex gap-8 text-sm font-medium text-gray-300">
            <li class="hover:text-white cursor-pointer">Accueil</li>
            <li class="hover:text-white cursor-pointer">Communauté</li>
            <li class="hover:text-white cursor-pointer">Discord</li>
            <li class="hover:text-white cursor-pointer">Staff</li>
            <li class="hover:text-white cursor-pointer">Wiki</li>
            <li class="hover:text-white cursor-pointer">Boutique</li>
        </ul>

        <div class="flex gap-3">
            <button class="px-5 py-1.5 border border-red-500/50 bg-red-500/20 rounded text-sm hover:bg-red-500 transition">Jouer</button>
            <button class="px-5 py-1.5 bg-indigo-600/30 border border-indigo-500/50 rounded text-sm hover:bg-indigo-600 transition">Discord</button>
        </div>
    </nav>

    <main class="flex-1 flex flex-col items-center justify-center text-center px-4">
        <div class="mb-6">
             <img src="logo.png" alt="Logo" class="w-48 h-48 drop-shadow-2xl">
        </div>

        <h2 class="text-6xl md:text-8xl font-extrabold tracking-tight mb-10 drop-shadow-lg">
            Inside Roleplay
        </h2>

        <div class="flex flex-col md:flex-row gap-6">
            <button class="flex items-center justify-center gap-3 px-10 py-4 bg-red-500 rounded-full font-bold text-lg shadow-xl shadow-red-500/20 hover:scale-105 transition-transform">
                <span>🚀</span> Rejoindre le Serveur
            </button>
            <button class="flex items-center justify-center gap-3 px-10 py-4 bg-purple-600 rounded-full font-bold text-lg shadow-xl shadow-purple-500/20 hover:scale-105 transition-transform">
                <span>💬</span> Rejoindre le Discord
            </button>
        </div>
    </main>

    <div class="p-6 flex justify-between items-center opacity-50">
        <div class="p-2 border border-white rounded-full">🔇</div>
        <div class="p-2 border border-white rounded-full">👁️</div>
    </div>

</body>
</html>
