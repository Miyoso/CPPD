<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPPD • Armurerie Centrale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --glass: rgba(15, 23, 42, 0.75); --glass-border: rgba(255, 255, 255, 0.1); }
        body { background: radial-gradient(circle at 50% 0%, #1e293b 0%, #020617 100%); color: #cbd5e1; font-family: 'Inter', sans-serif; min-height: 100vh; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 1.5rem; }
        .glass-input { background: rgba(0, 0, 0, 0.4) !important; border: 1px solid var(--glass-border) !important; color: white !important; outline: none; }
    </style>
</head>
<body class="p-8">
    <header class="max-w-7xl mx-auto glass-card p-6 mb-8 flex justify-between items-center">
        <h1 class="text-2xl font-black uppercase italic tracking-tighter">Armurerie • Gestion de Stock</h1>
        <a href="index.html" class="glass-card px-6 py-2 text-xs font-bold uppercase hover:bg-slate-600 transition-all">Retour Terminal</a>
    </header>

    <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        <section class="glass-card p-6 space-y-4">
            <h2 class="text-xs font-black uppercase text-blue-400 tracking-widest">Enregistrer une Arme</h2>
            <input type="text" id="modele" placeholder="Modèle d'arme" class="glass-input w-full rounded-xl p-3 text-sm">
            <input type="text" id="serial" placeholder="Numéro de série" class="glass-input w-full rounded-xl p-3 text-sm">
            <input type="text" id="agent" placeholder="Agent (Matricule)" class="glass-input w-full rounded-xl p-3 text-sm">
            <button onclick="addWeapon()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-xl transition-all uppercase text-xs">Enregistrer</button>
        </section>

        <section class="lg:col-span-2 glass-card overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-white/5 text-[10px] uppercase font-bold text-slate-500">
                    <tr>
                        <th class="p-4">Modèle</th>
                        <th class="p-4">N° Série</th>
                        <th class="p-4">Détenteur</th>
                        <th class="p-4">Actions</th>
                    </tr>
                </thead>
                <tbody id="stockTable" class="text-sm divide-y divide-white/5">
                    </tbody>
            </table>
        </section>
    </main>

    <script>
        async function fetchStock() {
            const res = await fetch('/api/individus?type=stock'); // Nécessite mise à jour API
            const data = await res.json();
            document.getElementById('stockTable').innerHTML = data.map(w => `
                <tr class="hover:bg-white/5 transition-colors">
                    <td class="p-4 font-bold text-white">${w.modele}</td>
                    <td class="p-4 font-mono text-xs text-blue-400">${w.numero_serie}</td>
                    <td class="p-4 text-slate-400">${w.agent_detenteur || 'En stock'}</td>
                    <td class="p-4"><button class="text-red-400 hover:text-red-300">Récupérer</button></td>
                </tr>
            `).join('');
        }
        fetchStock();
    </script>
</body>
</html>
