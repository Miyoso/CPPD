<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPPD • Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        slate: { 750: '#2d3748', 850: '#1a202c', 950: '#0f172a' }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        body { background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="text-slate-300 font-sans min-h-screen flex flex-col antialiased selection:bg-blue-500 selection:text-white">

    <header class="sticky top-4 z-50 px-4 mb-4">
        <div class="max-w-7xl mx-auto bg-slate-800/80 backdrop-blur-md border border-slate-700/50 rounded-2xl shadow-2xl p-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <div class="bg-blue-600/20 p-2 rounded-lg border border-blue-500/30">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3" /></svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white tracking-tight">• CPPD</h1>
                    <p class="text-xs text-slate-400 font-medium tracking-wide uppercase">Calculateur Pénal (Neon DB)</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4 w-full md:w-auto">
                <div class="relative w-full md:w-80 group">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" /></svg>
                    </div>
                    <input type="text" id="searchBar" placeholder="Rechercher une infraction..." disabled class="block w-full pl-10 pr-3 py-2.5 border border-slate-700 rounded-xl bg-slate-900/50 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition-all opacity-50" onkeyup="filterLaws()">
                </div>
                <div class="flex gap-2">
                    <a href="Individus.html" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2.5 rounded-xl font-bold text-xs uppercase transition-all">Individus</a>
                    <a href="Lois.html" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2.5 rounded-xl font-bold text-xs uppercase transition-all">Gérer Lois</a>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto w-full p-4 flex flex-col-reverse lg:flex-row gap-8 items-start">
        
        <div id="lawsContainer" class="flex-1 w-full space-y-8 pb-20">
            <div class="flex flex-col items-center justify-center h-64 space-y-4">
                <div class="relative w-16 h-16">
                    <div class="absolute top-0 left-0 w-full h-full border-4 border-slate-700 rounded-full"></div>
                    <div class="absolute top-0 left-0 w-full h-full border-4 border-blue-500 rounded-full border-t-transparent animate-spin"></div>
                </div>
                <span class="text-slate-400 font-medium animate-pulse">Synchronisation avec Neon...</span>
            </div>
        </div>

        <div class="lg:w-[380px] shrink-0 lg:sticky lg:top-32 w-full">
            <div class="bg-slate-800/90 backdrop-blur-sm rounded-2xl border border-slate-700/50 shadow-2xl overflow-hidden flex flex-col transition-all duration-300">
                
                <div class="bg-slate-850 p-4 border-b border-slate-700 flex justify-between items-center">
                    <h2 class="text-sm font-bold text-slate-100 uppercase flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-blue-500 shadow-[0_0_8px_rgba(59,130,246,0.5)]"></span>
                        Dossier en cours
                    </h2>
                    <span id="countBadge" class="bg-slate-700 text-slate-200 text-xs font-bold px-2.5 py-0.5 rounded-md">0</span>
                </div>

                <div id="cartList" class="max-h-[40vh] overflow-y-auto p-2 space-y-2 min-h-[150px] bg-slate-900/30">
                    <div class="h-32 flex flex-col items-center justify-center text-slate-600 opacity-60">
                        <span class="text-xs font-medium">Aucune sélection</span>
                    </div>
                </div>

                <div class="p-4 bg-slate-800 border-t border-slate-700 space-y-4">
                    <label class="group relative flex items-center p-4 rounded-xl border border-slate-700 bg-slate-850 cursor-pointer transition-all duration-200" id="firstOffenseLabel">
                        <input type="checkbox" id="firstOffenseCheck" class="peer sr-only" onchange="calculate()">
                        <div class="flex-1">
                            <div class="flex items-center justify-between">
                                <span class="font-bold text-sm text-slate-200">1ère Interpellation</span>
                                <div id="checkboxSquare" class="w-6 h-6 rounded border-2 border-slate-500 bg-slate-900 flex items-center justify-center transition-all">
                                    <svg id="checkboxIcon" class="w-4 h-4 text-white opacity-0 transition-all transform scale-50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                </div>
                            </div>
                            <div class="text-[11px] text-slate-400 mt-1 flex gap-2">
                                <span class="bg-slate-700/50 px-2 py-0.5 rounded">Amende ÷ 2</span>
                                <span class="bg-slate-700/50 px-2 py-0.5 rounded">Pas de Ban</span>
                            </div>
                        </div>
                    </label>

                    <div class="bg-slate-900 rounded-xl p-4 border border-slate-700">
                        <div class="flex justify-between items-end mb-2">
                            <span class="text-[10px] uppercase font-bold text-slate-500 tracking-wider">Total Amende</span>
                            <span id="totalFine" class="text-3xl font-bold text-emerald-400 font-mono">0 $</span>
                        </div>
                        <div class="h-px bg-slate-800 my-3"></div>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="text-center">
                                <span class="text-[10px] uppercase font-bold text-slate-500 block mb-1">Prison</span>
                                <span id="totalPrison" class="text-base font-bold text-blue-400">0 Min</span>
                            </div>
                            <div class="text-center border-l border-slate-800">
                                <span class="text-[10px] uppercase font-bold text-slate-500 block mb-1">Bannissement</span>
                                <span id="maxBan" class="text-base font-bold text-slate-500">-</span>
                            </div>
                        </div>
                    </div>

                    <button onclick="resetAll()" class="w-full py-3.5 rounded-xl font-bold text-xs uppercase tracking-widest text-white bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 transition-all flex items-center justify-center gap-2">
                        Effacer Tout
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        let categories = [];
        let cart = [];

        const categoryStyles = {
            "Code de la route": "from-emerald-900/50 to-emerald-900/10 border-emerald-500/50 text-emerald-100",
            "Délit mineur": "from-blue-900/50 to-blue-900/10 border-blue-500/50 text-blue-100",
            "Délits moyen": "from-yellow-900/50 to-yellow-900/10 border-yellow-500/50 text-yellow-100",
            "Délits majeur": "from-red-900/50 to-red-900/10 border-red-500/50 text-red-100",
            "Crime": "from-purple-900/50 to-purple-900/10 border-purple-500/50 text-purple-100",
            "Objet illégaux et drogues": "from-orange-900/50 to-orange-900/10 border-orange-500/50 text-orange-100",
            "Armes": "from-slate-700 to-slate-800 border-slate-500/50 text-slate-200"
        };
        const defaultStyle = "from-slate-800 to-slate-900 border-slate-600 text-slate-300";

        async function init() {
            try {
                const response = await fetch('/api/individus?type=lois');
                const data = await response.json();
                
                const tempCats = {};
                data.forEach(item => {
                    const catName = item.categorie;
                    if (!tempCats[catName]) {
                        tempCats[catName] = {
                            name: catName,
                            style: categoryStyles[catName] || defaultStyle,
                            items: []
                        };
                    }
                    tempCats[catName].items.push(item);
                });
                categories = Object.values(tempCats);
                
                const searchInput = document.getElementById('searchBar');
                searchInput.disabled = false;
                searchInput.style.opacity = "1";
                renderLaws();

            } catch (error) {
                document.getElementById('lawsContainer').innerHTML = `<div class="text-red-400 p-8 text-center bg-red-900/20 rounded-2xl border border-red-500/50">Erreur de connexion Neon.</div>`;
            }
        }

        function renderLaws() {
            const container = document.getElementById('lawsContainer');
            container.innerHTML = '';

            categories.forEach((cat) => {
                const section = document.createElement('div');
                section.className = 'law-category animate-fade-in mb-8';
                
                section.innerHTML = `
                    <div class="flex items-center px-4 py-3 rounded-t-xl border-t border-x bg-gradient-to-r ${cat.style}">
                        <h2 class="text-sm font-bold uppercase tracking-widest">${cat.name}</h2>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 bg-slate-800/50 p-4 rounded-b-xl border-x border-b border-slate-700/50 shadow-lg">
                        ${cat.items.map((item) => `
                            <button id="btn-${item.id}" onclick="toggleItem(${item.id})" class="law-item group relative text-left p-3.5 rounded-xl border border-slate-700 bg-slate-800 hover:bg-slate-750 transition-all duration-200 flex flex-col justify-between h-full">
                                <div class="flex justify-between items-start gap-3 mb-2">
                                    <span class="font-medium text-slate-200 text-sm leading-snug group-hover:text-white">${item.label}</span>
                                    <span class="shrink-0 font-mono text-xs font-bold text-emerald-400 bg-emerald-900/10 px-2 py-1 rounded border border-emerald-500/20">${item.amende}$</span>
                                </div>
                                ${item.sanction ? `<div class="mt-auto pt-2 border-t border-slate-700/50 flex gap-1.5 opacity-80"><span class="text-[10px] text-orange-400">⚠️</span><span class="text-[10px] text-orange-200/90 italic leading-tight">${item.sanction}</span></div>` : ''}
                                <div class="selection-ring absolute inset-0 border-2 border-blue-500 rounded-xl opacity-0 scale-95 transition-all pointer-events-none"></div>
                            </button>
                        `).join('')}
                    </div>
                `;
                container.appendChild(section);
            });
        }

        function toggleItem(id) {
            const allItems = categories.flatMap(c => c.items);
            const item = allItems.find(i => i.id === id);
            const btn = document.getElementById(`btn-${id}`);
            const ring = btn.querySelector('.selection-ring');
            
            const existingIdx = cart.findIndex(i => i.id === id);

            if (existingIdx > -1) {
                cart.splice(existingIdx, 1);
                ring.classList.remove('opacity-100', 'scale-100');
                ring.classList.add('opacity-0', 'scale-95');
            } else {
                cart.push(item);
                ring.classList.remove('opacity-0', 'scale-95');
                ring.classList.add('opacity-100', 'scale-100');
            }
            calculate();
        }

        function calculate() {
            const list = document.getElementById('cartList');
            const badge = document.getElementById('countBadge');
            badge.innerText = cart.length;
            list.innerHTML = '';

            if (cart.length === 0) {
                list.innerHTML = `<div class="h-32 flex flex-col items-center justify-center text-slate-600 opacity-60"><span class="text-xs font-medium">Aucune sélection</span></div>`;
            } else {
                cart.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'bg-slate-800 p-2.5 rounded-lg border border-slate-700/50 animate-fade-in';
                    row.innerHTML = `<div class="flex justify-between items-start text-sm"><span class="text-slate-200 font-medium leading-tight pr-2">${item.label}</span><span class="text-emerald-400 font-mono text-xs font-bold">${item.amende} $</span></div>`;
                    list.appendChild(row);
                });
            }

            let fine = cart.reduce((acc, i) => acc + i.amende, 0);
            let prison = cart.reduce((acc, i) => acc + i.prison, 0);
            let ban = cart.reduce((max, i) => (i.ban > max ? i.ban : max), 0);

            const isFirst = document.getElementById('firstOffenseCheck').checked;
            const label = document.getElementById('firstOffenseLabel');
            const square = document.getElementById('checkboxSquare');
            const icon = document.getElementById('checkboxIcon');

            if (isFirst) {
                fine = Math.floor(fine / 2);
                if (ban < 999) ban = 0;
                label.className = "group relative flex items-center p-4 rounded-xl border-2 border-emerald-500 bg-emerald-950/40 cursor-pointer shadow-[0_0_15px_rgba(16,185,129,0.2)]";
                square.className = "w-6 h-6 rounded border-2 border-emerald-500 bg-emerald-600 flex items-center justify-center";
                icon.classList.replace('opacity-0', 'opacity-100');
                icon.classList.replace('scale-50', 'scale-100');
            } else {
                label.className = "group relative flex items-center p-4 rounded-xl border border-slate-700 bg-slate-850 cursor-pointer";
                square.className = "w-6 h-6 rounded border-2 border-slate-500 bg-slate-900 flex items-center justify-center";
                icon.classList.replace('opacity-100', 'opacity-0');
                icon.classList.replace('scale-100', 'scale-50');
            }

            document.getElementById('totalFine').innerText = fine.toLocaleString() + " $";
            document.getElementById('totalPrison').innerText = prison + " Min";
            
            const banEl = document.getElementById('maxBan');
            if (ban >= 999) {
                banEl.innerText = "DÉFINITIF";
                banEl.className = "text-base font-bold text-red-500 animate-pulse";
            } else if (ban > 0) {
                banEl.innerText = ban + " Jours";
                banEl.className = "text-base font-bold text-red-400";
            } else {
                banEl.innerText = "Non";
                banEl.className = "text-base font-bold text-slate-500";
            }
        }

        function filterLaws() {
            const term = document.getElementById('searchBar').value.toLowerCase();
            document.querySelectorAll('.law-category').forEach(catDiv => {
                const btns = catDiv.querySelectorAll('button');
                let hasVisible = false;
                btns.forEach(btn => {
                    const text = btn.innerText.toLowerCase();
                    const visible = text.includes(term);
                    btn.style.display = visible ? "flex" : "none";
                    if (visible) hasVisible = true;
                });
                catDiv.style.display = hasVisible ? "block" : "none";
            });
        }

        function resetAll() {
            cart = [];
            document.getElementById('firstOffenseCheck').checked = false;
            document.querySelectorAll('.selection-ring').forEach(el => {
                el.classList.remove('opacity-100', 'scale-100');
                el.classList.add('opacity-0', 'scale-95');
            });
            calculate();
        }

        init();
    </script>
</body>
</html>
