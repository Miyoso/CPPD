<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPPD • Logs Crystal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #0f172a;
            /* Fond avec des formes diffuses pour accentuer l'effet de transparence */
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(147, 51, 234, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        /* L'effet Glassmorphism central */
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        .glass-hover:hover {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8 text-slate-200 antialiased">
    <div class="max-w-6xl mx-auto">
        
        <header class="glass rounded-[2rem] p-6 mb-8 flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 glass rounded-2xl flex items-center justify-center border border-white/20">
                    <img src="LogoCPPD.png" class="w-8 h-8 object-contain opacity-80">
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-tighter uppercase italic text-white">Security Intelligence</h1>
                    <p class="text-[9px] font-bold tracking-[0.3em] text-blue-400 uppercase opacity-70">Log Analytics v3.0</p>
                </div>
            </div>
            
            <div class="flex items-center gap-6">
                <div class="text-center">
                    <span id="totalLogs" class="block text-2xl font-black text-white">0</span>
                    <span class="text-[9px] uppercase font-bold text-slate-500 tracking-widest">Entrées</span>
                </div>
                <a href="Individus.html" class="glass glass-hover px-6 py-3 rounded-2xl text-xs font-bold uppercase tracking-widest border border-white/10">
                    Fermer
                </a>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="md:col-span-2 relative">
                <input type="text" id="logSearch" placeholder="Rechercher un agent ou un dossier..." onkeyup="filterLogs()" 
                       class="glass w-full rounded-2xl p-4 pl-12 text-sm outline-none focus:border-blue-500/50 transition-all placeholder:text-slate-500">
                <svg class="w-5 h-5 text-slate-500 absolute left-4 top-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </div>
            <select id="actionFilter" onchange="filterLogs()" 
                    class="glass rounded-2xl px-6 py-4 text-xs font-bold uppercase outline-none cursor-pointer focus:border-blue-500/50">
                <option value="all" class="bg-slate-900 text-white">Toutes les actions</option>
                <option value="SUPPRESSION" class="bg-slate-900 text-white">Suppressions</option>
                <option value="MODIFICATION" class="bg-slate-900 text-white">Modifications</option>
                <option value="CREATION" class="bg-slate-900 text-white">Créations</option>
            </select>
        </div>

        <div class="glass rounded-[2.5rem] overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="text-[10px] uppercase font-bold text-slate-400 tracking-[0.2em] border-b border-white/5">
                            <th class="p-6">Time-Stamp</th>
                            <th class="p-6">Protocole</th>
                            <th class="p-6">Identifiant Agent</th>
                            <th class="p-6">Metadata</th>
                        </tr>
                    </thead>
                    <tbody id="logContent" class="text-sm divide-y divide-white/5">
                        </tbody>
                </table>
            </div>
            <div id="noLogs" class="hidden p-20 text-center text-slate-500 italic uppercase tracking-widest text-xs">
                Aucune donnée détectée dans la matrice.
            </div>
        </div>
    </div>

    <script>
        let allLogs = [];

        async function fetchLogs() {
            try {
                const res = await fetch('/api/individus?type=logs');
                allLogs = await res.json();
                document.getElementById('totalLogs').innerText = allLogs.length;
                renderLogs(allLogs);
            } catch (e) { console.error(e); }
        }

        function renderLogs(data) {
            const container = document.getElementById('logContent');
            const noLogs = document.getElementById('noLogs');
            
            if (data.length === 0) {
                container.innerHTML = "";
                noLogs.classList.remove('hidden');
                return;
            }
            
            noLogs.classList.add('hidden');
            container.innerHTML = data.map(l => {
                const type = l.action;
                const actionBadge = type === 'SUPPRESSION' 
                    ? 'border-red-500/30 text-red-400 bg-red-500/5' 
                    : type === 'MODIFICATION' 
                        ? 'border-blue-500/30 text-blue-400 bg-blue-500/5' 
                        : 'border-emerald-500/30 text-emerald-400 bg-emerald-500/5';

                return `
                    <tr class="glass-hover transition-all">
                        <td class="p-6 font-mono text-[11px] text-slate-400">
                            ${new Date(l.date).toLocaleString('fr-FR')}
                        </td>
                        <td class="p-6">
                            <span class="px-3 py-1 rounded-lg border text-[9px] font-black tracking-widest ${actionBadge}">
                                ${type}
                            </span>
                        </td>
                        <td class="p-6">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-xl glass flex items-center justify-center text-[10px] font-black border border-white/10 text-white">
                                    ${l.officier.substring(0,2).toUpperCase()}
                                </div>
                                <span class="font-bold text-slate-100">${l.officier}</span>
                            </div>
                        </td>
                        <td class="p-6 italic text-slate-400 text-xs">
                            ${l.detail}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function filterLogs() {
            const query = document.getElementById('logSearch').value.toLowerCase();
            const action = document.getElementById('actionFilter').value;
            const filtered = allLogs.filter(l => {
                const matchesSearch = l.officier.toLowerCase().includes(query) || l.detail.toLowerCase().includes(query);
                const matchesAction = action === 'all' || l.action === action;
                return matchesSearch && matchesAction;
            });
            renderLogs(filtered);
        }

        fetchLogs();
    </script>
</body>
</html>
