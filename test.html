<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPPD • Générateur de Plainte</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%); background-color: #0f172a; }
        .document-print { background: white; color: black; font-family: 'Inter', serif; line-height: 1.4; width: 100%; max-width: 850px; margin: 0 auto; }
        .hidden-section { display: none; }
        #preview-faits, #preview-menaces, #preview-demandes { white-space: pre-wrap; word-break: break-word; width: 100%; text-align: justify; }
        section { margin-bottom: 1rem; width: 100%; }
        @media print { 
            .no-print { display: none; } 
            body { background: white !important; }
            .document-print { margin: 0; padding: 1cm; width: 100%; max-width: none; border: none; } 
        }
    </style>
</head>
<body class="text-slate-300 font-sans min-h-screen flex flex-col antialiased">
    
    <header class="no-print sticky top-4 z-50 px-4 mb-4">
        <div class="max-w-5xl mx-auto bg-slate-800/80 backdrop-blur-md border border-slate-700/50 rounded-2xl p-4 flex justify-between items-center shadow-2xl">
            <h1 class="text-xl font-bold text-white tracking-tight uppercase">C.P.P.D • GÉNÉRATEUR</h1>
            <button id="download-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-2 rounded-xl transition-all uppercase text-xs tracking-widest">Télécharger PDF</button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto w-full p-4 flex flex-col gap-4 mb-10">
        <div class="no-print space-y-4 bg-slate-800/50 p-6 rounded-2xl border border-slate-700/50 shadow-xl">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="plaignant" placeholder="Plaignant" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none">
                <input type="text" id="accuse" placeholder="Mis en cause" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none">
            </div>
            <input type="text" id="objet" placeholder="Objet" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none">
            <textarea id="faits" rows="4" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none resize-none" placeholder="Faits..."></textarea>
            
            <div class="flex items-center space-x-3">
                <input type="checkbox" id="checkMenaces" class="w-4 h-4 text-blue-600 bg-slate-900 border-slate-700 rounded">
                <label for="checkMenaces" class="text-xs font-bold uppercase text-slate-300">Section Menaces</label>
            </div>

            <textarea id="valMenaces" rows="2" class="hidden-section w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none resize-none" placeholder="Détail menaces..."></textarea>
            <textarea id="qualifications" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none resize-none" placeholder="Qualifications..."></textarea>
            <textarea id="demandes" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white outline-none resize-none" placeholder="Demandes..."></textarea>
        </div>

        <div id="document-preview" class="document-print rounded-sm p-8 min-h-[29.7cm] flex flex-col text-black shadow-2xl">
            <div class="flex justify-between items-start mb-6">
                <div class="text-[10px] leading-tight">
                    <p class="font-bold uppercase underline">Plaignant :</p>
                    <p id="preview-plaignant" class="italic text-slate-400">[Nom]</p>
                    <div class="mt-4 font-bold uppercase underline">À l'attention du :</div>
                    <p>Cayo Perico Police Department</p>
                </div>
                <img src="CPPD.png" class="w-24 h-24 object-contain">
            </div>

            <div class="text-right text-[10px] mb-4 italic">Fait le <span id="current-date"></span></div>

            <div class="text-center mb-6">
                <h1 class="text-lg font-bold border-y border-black py-2 uppercase">Dépôt de plainte formelle</h1>
                <p class="mt-2 text-sm">Objet : <span id="preview-objet" class="underline"></span></p>
            </div>

            <div class="space-y-4 text-[12px] w-full">
                <section>
                    <h3 class="font-bold uppercase border-b border-black mb-1">I. Mis en cause</h3>
                    <p>Contre : <span id="preview-accuse" class="font-bold italic text-slate-400"></span></p>
                </section>

                <section>
                    <h3 class="font-bold uppercase border-b border-black mb-1">II. Faits</h3>
                    <div id="preview-faits" class="leading-snug"></div>
                </section>

                <section id="sectionMenaces" class="hidden-section">
                    <h3 class="font-bold uppercase border-b border-black mb-1">III. Menaces</h3>
                    <div id="preview-menaces" class="leading-snug"></div>
                </section>

                <section>
                    <h3 id="labelIII" class="font-bold uppercase border-b border-black mb-1">III. Qualifications</h3>
                    <ul id="list-qualifications" class="list-disc ml-6 space-y-1"></ul>
                </section>

                <section>
                    <h3 id="labelIV" class="font-bold uppercase border-b border-black mb-1">IV. Demandes</h3>
                    <div id="preview-demandes" class="leading-snug"></div>
                </section>
            </div>

            <div class="mt-auto text-right text-[11px]">
                <p class="font-bold mb-8">Signature,</p>
                <p id="preview-sign" class="font-bold underline italic"></p>
            </div>
        </div>
    </main>

    <script>
        const inputs = ['plaignant', 'objet', 'accuse', 'faits', 'demandes', 'qualifications', 'valMenaces'];
        const checkMenaces = document.getElementById('checkMenaces');

        checkMenaces.addEventListener('change', (e) => {
            const isChecked = e.target.checked;
            document.getElementById('valMenaces').style.display = isChecked ? 'block' : 'none';
            document.getElementById('sectionMenaces').style.display = isChecked ? 'block' : 'none';
            document.getElementById('labelIII').innerText = isChecked ? "IV. Qualifications" : "III. Qualifications";
            document.getElementById('labelIV').innerText = isChecked ? "V. Demandes" : "IV. Demandes";
        });

        inputs.forEach(id => {
            document.getElementById(id).addEventListener('input', (e) => {
                const val = e.target.value;
                if (id === 'qualifications') {
                    const list = document.getElementById('list-qualifications');
                    list.innerHTML = val.split('\n').filter(l => l.trim()).map(l => `<li class="italic">${l}</li>`).join('');
                    return;
                }
                const previewId = id === 'valMenaces' ? 'preview-menaces' : 'preview-' + id;
                const el = document.getElementById(previewId);
                if (el) el.innerText = val;
                if (id === 'plaignant') document.getElementById('preview-sign').innerText = val;
            });
        });

        document.getElementById('current-date').innerText = new Date().toLocaleDateString('fr-FR');

        document.getElementById('download-btn').addEventListener('click', () => {
            const element = document.getElementById('document-preview');
            const opt = {
                margin: 5,
                filename: 'Plainte.pdf',
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        });
    </script>
</body>
</html>
