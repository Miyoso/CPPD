<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPPD • Logs de Sécurité</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%); 
            background-color: #0f172a; 
            min-height: 100vh; 
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        .log-row:hover { background: rgba(71, 85, 105, 0.1); }
    </style>
</head>
<body class="p-4 md:p-8 text-slate-300 antialiased font-sans">
    <div class="max-w-6xl mx-auto">
        
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 bg-slate-800/50 p-6 rounded-3xl border border-slate-700/50 shadow-2xl gap-6">
            <div>
                <h1 class="text-2xl font-black text-white tracking-tighter uppercase italic">Journal de Sécurité</h1>
                <p class="text-[10px] text-slate-500 uppercase font-bold tracking-[0.2em] mt-1">Surveillance des protocoles terminaux</p>
            </div>
            
            <div class="flex gap-4 items-center">
                <div class="text-right hidden sm:block">
                    <p class="text-[10px] font-bold text-slate-500 uppercase">Actions Totales</p>
                    <p id="totalLogs" class="text-xl font-black text-blue-400">0</p>
                </div>
                <a href="Individus.html" class="bg-slate-700 hover:bg-slate-600 text-white px-6 py-3 rounded-2xl font-bold text-xs uppercase transition-all shadow-lg">Retour Base</a>
            </div>
        </header>

        <div class="mb-6 flex flex-col md:flex-row gap-4">
            <div class="relative flex-grow">
                <input type="text" id="logSearch" placeholder="Filtrer par officier ou détail..." onkeyup="filterLogs()" class="w-full bg-slate-900/80 border border-slate-700 rounded-2xl p-4 text-sm text-white outline-none focus:ring-2 focus:ring-blue-500/50 pl-12 transition-all">
                <svg class="w-5 h-5 text-slate-500 absolute left-4 top-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </div>
            <select id="actionFilter" onchange="filterLogs()" class="bg-slate-900 border border-slate-700 text-white rounded-2xl px-6 py-4 outline-none focus:ring-2 focus:ring-blue-500/50 font-bold text-xs uppercase cursor-pointer">
                <option value="all">Toutes les actions</option>
                <option value="SUPPRESSION">Suppressions</option>
                <option value="MODIFICATION">Modifications</option>
                <option value="CREATION">Créations</option>
            </select>
        </div>

        <div class="bg-slate-900/50 rounded-3xl border border-slate-700/50 overflow-hidden shadow-2xl backdrop-blur-sm">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-950/50 text-[10px] uppercase font-black text-slate-500 tracking-widest border-b border-slate-800">
                            <th class="p-5">Horodatage</th>
                            <th class="p-5">Type d'Action</th>
                            <th class="p-5">Agent Responsable</th>
                            <th class="p-5">Données de l'Action</th>
                        </tr>
                    </thead>
                    <tbody id="logContent" class="text-sm divide-y divide-slate-800">
                        </tbody>
                </table>
            </div>
            <div id="noLogs" class="hidden p-10 text-center text-slate-600 italic">
                Aucune entrée correspondant à la recherche.
            </div>
        </div>
    </div>

    <script>
        let allLogs = [];

        async function fetchLogs() {
            try {
                const res = await fetch('/api/individus?type=logs');
                allLogs = await res.json();
                document.getElementById('totalLogs').innerText = allLogs.length;
                renderLogs(allLogs);
            } catch (e) {
                console.error("Erreur lors de la récupération des logs", e);
            }
        }

        function renderLogs(data) {
            const container = document.getElementById('logContent');
            const noLogs = document.getElementById('noLogs');
            
            if (data.length === 0) {
                container.innerHTML = "";
                noLogs.classList.remove('hidden');
                return;
            }
            
            noLogs.classList.add('hidden');
            container.innerHTML = data.map(l => {
                const isCritique = l.action === 'SUPPRESSION';
                const actionColor = isCritique 
                    ? 'bg-red-500/10 text-red-400 border-red-500/20' 
                    : l.action === 'MODIFICATION' 
                        ? 'bg-blue-500/10 text-blue-400 border-blue-500/20' 
                        : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';

                return `
                    <tr class="log-row transition-all group">
                        <td class="p-5 font-mono text-[11px] text-slate-500 group-hover:text-slate-300">
                            ${new Date(l.date).toLocaleString('fr-FR')}
                        </td>
                        <td class="p-5">
                            <span class="px-3 py-1 rounded-full border text-[9px] font-black tracking-widest ${actionColor}">
                                ${l.action}
                            </span>
                        </td>
                        <td class="p-5">
                            <div class="flex items-center gap-2">
                                <div class="w-6 h-6 rounded-full bg-slate-700 flex items-center justify-center text-[10px] font-bold text-white">
                                    ${l.officier.charAt(0)}
                                </div>
                                <span class="font-bold text-slate-200">${l.officier}</span>
                            </div>
                        </td>
                        <td class="p-5 italic text-slate-400 text-xs">
                            ${l.detail}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function filterLogs() {
            const query = document.getElementById('logSearch').value.toLowerCase();
            const action = document.getElementById('actionFilter').value;

            const filtered = allLogs.filter(l => {
                const matchesSearch = l.officier.toLowerCase().includes(query) || l.detail.toLowerCase().includes(query);
                const matchesAction = action === 'all' || l.action === action;
                return matchesSearch && matchesAction;
            });

            renderLogs(filtered);
        }

        // Chargement initial
        fetchLogs();
    </script>
</body>
</html>
