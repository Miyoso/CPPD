<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; }
        .card-recherche { border-left: 4px solid #ef4444; background: rgba(30, 41, 59, 0.7); }
        .card-regle { border-left: 4px solid #10b981; background: rgba(30, 41, 59, 0.7); }
    </style>
</head>
<body class="p-8">

    <div class="flex justify-between items-center mb-8">
        <h1 class="text-2xl font-bold tracking-tighter text-gray-300">MDT DATABASE</h1>
        <button onclick="fetchData()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded text-sm font-bold transition">ACTUALISER</button>
    </div>

    <div id="dossiers-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

    <script>
        async function fetchData() {
            try {
                const response = await fetch('/api/individus'); 
                const data = await response.json();
                render(data);
            } catch (err) {
                console.error("Erreur de synchro", err);
            }
        }

        function render(dossiers) {
            const container = document.getElementById('dossiers-container');
            container.innerHTML = dossiers.map(d => `
                <div class="p-5 rounded-lg border border-gray-700 ${d.est_recherche_global ? 'card-recherche' : 'card-regle'}">
                    <div class="flex justify-between items-start">
                        <div>
                            <h2 class="text-xl font-bold">${d.nom}</h2>
                            <p class="text-gray-500 text-xs">TEL: ${d.telephone}</p>
                        </div>
                        <span class="px-2 py-1 rounded text-[10px] font-black ${d.est_recherche_global ? 'bg-red-600' : 'bg-green-600'}">
                            ${d.est_recherche_global ? 'RECHERCHÉ' : 'EN RÈGLE'}
                        </span>
                    </div>
                    
                    <div class="mt-4 space-y-2">
                        ${d.historique_total.map(h => `
                            <div class="bg-black/30 p-2 rounded border border-gray-800">
                                <div class="flex justify-between text-[10px] mb-1 font-mono">
                                    <span class="text-blue-400">${h.date}</span>
                                    <span class="${h.statut === 'Recherché' ? 'text-red-500' : 'text-green-500'}">${h.statut}</span>
                                </div>
                                <p class="text-xs text-gray-300 leading-relaxed">${h.motif}</p>
                                ${h.casiers ? `<p class="text-[10px] text-gray-500 mt-1 italic">${h.casiers}</p>` : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        fetchData();
        setInterval(fetchData, 10000);
    </script>
</body>
</html>
