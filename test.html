<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPPD • Terminal de Justice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass: rgba(15, 23, 42, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-blue: #3b82f6;
        }

        body { 
            background: radial-gradient(circle at 50% 0%, #1e293b 0%, #020617 100%);
            background-color: #020617;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        /* Effet Crystal Glass */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 1.5rem;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.3) !important;
            border: 1px solid var(--glass-border) !important;
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            border-color: var(--accent-blue) !important;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
        }

        /* Animation de scan de police */
        .scanline {
            width: 100%; height: 2px;
            background: rgba(59, 130, 246, 0.1);
            position: fixed; top: 0; z-index: 100;
            animation: scan 4s linear infinite;
        }

        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }
    </style>
</head>
<body class="p-4">
    <div class="scanline"></div>

    <header class="max-w-7xl mx-auto glass-card p-6 mb-8 flex justify-between items-center">
        <div class="flex items-center gap-4">
            <img src="LogoCPPD.png" class="w-12 h-12 object-contain drop-shadow-[0_0_10px_rgba(59,130,246,0.5)]">
            <div>
                <h1 class="text-xl font-black tracking-tighter uppercase italic">Central Command</h1>
                <p class="text-[9px] font-bold tracking-[0.3em] text-blue-400 uppercase">Database Access v3.0</p>
            </div>
        </div>
        <nav class="flex gap-3">
            <a href="Individus.html" class="glass-card px-5 py-2 text-[10px] font-bold uppercase hover:bg-blue-600 transition-all">Individus</a>
            <a href="Logs.html" class="glass-card px-5 py-2 text-[10px] font-bold uppercase hover:bg-red-600 transition-all">Archives</a>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-2 space-y-6">
            <div class="glass-card p-4 flex gap-4">
                <input type="text" placeholder="Rechercher dans la matrice..." class="glass-input w-full rounded-xl p-3 text-sm outline-none">
            </div>
            
            <div class="glass-card p-6 border-l-4 border-blue-500 hover:scale-[1.01] transition-transform cursor-pointer">
                <div class="flex justify-between items-start">
                    <h3 class="font-bold text-white uppercase">Homicide Volontaire</h3>
                    <span class="font-mono text-blue-400">15,000$</span>
                </div>
                <p class="text-xs text-slate-400 mt-2 italic">Atteinte préméditée à la vie d'autrui.</p>
            </div>
        </div>

        <aside class="space-y-6">
            <div class="glass-card p-8 relative overflow-hidden">
                <div class="text-center mb-6">
                    <h2 class="font-black text-sm uppercase">Procès-Verbal</h2>
                    <div class="h-px bg-white/10 my-4"></div>
                </div>
                <div class="space-y-3 text-xs font-mono mb-8" id="ticketContent">
                    <div class="flex justify-between"><span>Délit de fuite</span><span>2,500$</span></div>
                </div>
                <button class="w-full bg-blue-600 p-4 rounded-xl font-black uppercase text-xs tracking-widest shadow-lg shadow-blue-900/40">
                    Calculer la peine
                </button>
            </div>
        </aside>
    </main>
</body>
</html>
