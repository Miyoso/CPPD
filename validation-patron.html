<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Validation des comptes</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 20px; background-color: #f8f9fa; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #1a73e8; padding-bottom: 10px; }
        h1 { color: #333; margin: 0; }
        .entite { font-weight: bold; color: #1a73e8; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 5px rgba(0,0,0,0.1); }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #1a73e8; color: white; font-weight: 500; }
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 0.85em; background: #ffeeba; color: #856404; }
        .btn-check { background: #28a745; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; margin-right: 5px; }
        .btn-check:hover { background: #218838; }
        .btn-deny { background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
        .btn-deny:hover { background: #c82333; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Validation des accès</h1>
        <div>Entreprise : <span class="entite">Entreprise Alpha</span></div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Candidat</th>
                <th>Email</th>
                <th>Date Demande</th>
                <th>Statut</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <!-- Exemple de ligne générée par la base Neon -->
            <tr>
                <td>Marc Lefebvre</td>
                <td>marc.l@alpha.fr</td>
                <td>30/04/2026</td>
                <td><span class="badge">En attente</span></td>
                <td>
                    <button class="btn-check">Approuver</button>
                    <button class="btn-deny">Refuser</button>
                </td>
            </tr>
            <tr>
                <td>Sophie Perrin</td>
                <td>s.perrin@alpha.fr</td>
                <td>29/04/2026</td>
                <td><span class="badge">En attente</span></td>
                <td>
                    <button class="btn-check">Approuver</button>
                    <button class="btn-deny">Refuser</button>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
